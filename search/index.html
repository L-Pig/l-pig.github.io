dark:#F47067\&quot;&gt; OR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; age &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 25&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;优化方案：\n&lt;ul&gt;\n&lt;li&gt;给OR条件中的字段加索引&lt;/li&gt;\n&lt;li&gt;使用 &lt;code&gt;union&lt;/code&gt; 代替 &lt;code&gt;or&lt;/code&gt; 连接条件&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;5-like查询-是以-开头\&quot;&gt;5. like查询 &lt;strong&gt;是以 &lt;code&gt;&#39;%&#39;&lt;/code&gt;开头&lt;/strong&gt; 。’&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;索引失效，原因是like查询是以&lt;code&gt;&#39;%&#39;&lt;/code&gt;开头，B+树是按照顺序排列的，后缀匹配无法利用有序性。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;失效sql：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;  EXPLAIN &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;SELECT&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; FROM&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; staff &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;WHERE&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; name&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; LIKE&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;%张&#39;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;有效sql：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;EXPLAIN &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;SELECT&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; FROM&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; staff &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;WHERE&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; name&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; LIKE&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;张%&#39;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;6-使用-betweenand\&quot;&gt;6. &lt;strong&gt;使用 &lt;code&gt;&amp;#x3C;&lt;/code&gt;,&lt;code&gt;&gt;&lt;/code&gt;、&lt;code&gt;between、and&lt;/code&gt;&lt;/strong&gt;。&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;在联合索引中，如果遇到范围查询（&lt;code&gt;&gt;&lt;/code&gt;, &lt;code&gt;&amp;#x3C;&lt;/code&gt;, &lt;code&gt;BETWEEN&lt;/code&gt;, &lt;code&gt;LIKE &#39;a%&#39;&lt;/code&gt;），则&lt;strong&gt;范围条件右边的列&lt;/strong&gt;无法用到索引，存储引擎不能使用索引中范围条件右边的列，无法重建索引&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;部分失效 SQL：\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;EXPLAIN &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;SELECT&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; FROM&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; staff &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;WHERE&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; name&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;张三&#39;&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; AND&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; age &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;&gt;&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 25&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; AND&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; pos &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;董事长&#39;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;7-is-null-和-is-not-null\&quot;&gt;7. &lt;strong&gt;IS NULL 和 IS NOT NULL&lt;/strong&gt;&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;不同版本的 MySQL 中表现不同，但通常建议尽量避免允许 NULL 值。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;IS NOT NULL&lt;/code&gt; 通常会触发全表扫描&lt;/li&gt;\n&lt;li&gt;如果表中绝大多数数据都是 &lt;code&gt;NULL&lt;/code&gt;，那么查 &lt;code&gt;IS NOT NULL&lt;/code&gt; 可能会走索引。反之亦然。这取决于&lt;strong&gt;数据分布&lt;/strong&gt;。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;8-使用-select\&quot;&gt;8. 使用 &lt;strong&gt;select&lt;/strong&gt; 。&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;索引失效，原因是 &lt;code&gt;select&lt;/code&gt; 语句可能会导致 MySQL 优化器放弃使用索引，执行全表扫描。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;尽可能只查询需要的字段，避免 &lt;code&gt;select *&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;四-小口诀\&quot;&gt;四、 小口诀&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;全值匹配我最爱，最左前缀要遵守；&lt;/strong&gt;&lt;br&gt;\n      &lt;strong&gt;带头大哥不能死，中间兄弟不能断；&lt;/strong&gt;&lt;br&gt;\n      &lt;strong&gt;索引列上少计算，范围之后全失效；&lt;/strong&gt;&lt;br&gt;\n      &lt;strong&gt;LIKE百分写最右，覆盖索引不写星；&lt;/strong&gt;&lt;br&gt;\n      &lt;strong&gt;不等空值还有OR，索引失效要唯心（看优化器心情）。&lt;/strong&gt;&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;一如何判定索引实效&quot;],&quot;text&quot;:[0,&quot;一、如何判定索引实效&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;二explain-分析结果字段说明&quot;],&quot;text&quot;:[0,&quot;二、Explain 分析结果字段说明&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;三索引实效的情况&quot;],&quot;text&quot;:[0,&quot;三、索引实效的情况&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;1-违反-最左匹配原则&quot;],&quot;text&quot;:[0,&quot;1. 违反 最左匹配原则 。&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;2-在-索引列上操作&quot;],&quot;text&quot;:[0,&quot;2. 在 索引列上操作。&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;3-使用-不等于--或-等&quot;],&quot;text&quot;:[0,&quot;3. 使用 不等于 （!= 或 &lt;&gt;等）。&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;4-使用-or&quot;],&quot;text&quot;:[0,&quot;4. 使用 or 。&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;5-like查询-是以-开头&quot;],&quot;text&quot;:[0,&quot;5. like查询 是以 &#39;%&#39;开头 。’&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;6-使用-betweenand&quot;],&quot;text&quot;:[0,&quot;6. 使用 &lt;,&gt;、between、and。&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;7-is-null-和-is-not-null&quot;],&quot;text&quot;:[0,&quot;7. IS NULL 和 IS NOT NULL&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;8-使用-select&quot;],&quot;text&quot;:[0,&quot;8. 使用 select 。&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;四-小口诀&quot;],&quot;text&quot;:[0,&quot;四、 小口诀&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;MySQL索引失效的几种情况&quot;],&quot;description&quot;:[0,&quot;MySQL索引失效的几种情况&quot;],&quot;createdAt&quot;:[3,&quot;2026-01-12T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-12T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/mysql.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Mysql&quot;]]],&quot;tags&quot;:[1,[[0,&quot;mysql&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;kafka-install&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Kafka安装、部署、测试&quot;],&quot;description&quot;:[0,&quot;Kafka安装、部署、测试&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/kafka.Cv9_3xsp.png&quot;],&quot;width&quot;:[0,512],&quot;height&quot;:[0,256],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Kafka&quot;],[0,&quot;Linux&quot;]]],&quot;tags&quot;:[1,[[0,&quot;kafka&quot;],[0,&quot;linux&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;# Kafka安装、部署、测试\n\n## 一、介绍\n\n&gt;**Apache Kafka** 是一个**分布式流处理平台**（Distributed Streaming Platform），它最初由 LinkedIn 公司开发，后来贡献给了 Apache 基金会。  \n&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;简单来说，Kafka 经常被归类为“**消息队列**”（Message Queue, MQ）的一种，但它的功能和性能远超传统的消息队列。  \n&gt;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;为了让你更容易理解，我们可以分三个层面来讲：通俗比喻、核心概念、以及它主要用来做什么。  \n\n### 通俗比喻：Kafka 是什么？\n\n你可以把 Kafka 想象成一个**巨大的、分布式的、极高性能的“日志记录本”**。\n\n1.  **生产者（Producer）**：就像是负责写日记的人。不管是网站的点击流、银行的转账记录，还是服务器的报错日志，他们只管往这个本子的末尾疯狂地写数据。\n2.  **Kafka 集群（Broker）**：就是负责保管这些日志本的图书管理员。为了防止本子写满了或者丢失，管理员会把本子撕成几份（分区），甚至复印好几份（副本）存在不同的柜子（服务器）里。\n3.  **消费者（Consumer）**：就像是来阅读日记的人。\n    - 传统的信件（传统MQ）通常是“你看完就销毁了”。\n    - **Kafka 的特点是**：你看完了，日志还在那里。你可以现在看，也可以明天看，甚至可以让另一个人从头再看一遍。\n\n### 核心技术概念\n\n如果你是技术人员，以下几个术语是必须掌握的：\n\n1.  **Topic（主题）**：\n    - 数据的分类。比如“用户注册数据”是一个 Topic，“订单数据”是另一个 Topic。\n2.  **Partition（分区）**：\n    - 为了实现高性能，一个 Topic 会被切分成多个 Partition。\n    - **作用**：并发读写。比如一个 Topic 有 3 个分区，理论上就可以同时有 3 个人并行写入，速度提升 3 倍。\n3.  **Producer（生产者）** &amp; **Consumer（消费者）**：\n    - 发消息的和收消息的客户端。\n4.  **Broker（代理/服务器）**：\n    - 运行 Kafka 进程的服务器节点。一个 Kafka 集群由多个 Broker 组成。\n5.  **Consumer Group（消费者组）**：\n    - 这是 Kafka 的精髓。一个组内有多个消费者，它们配合起来消费一个 Topic。\n    - **规则**：组内的消费者不会重复消费同一条消息（负载均衡）。不同组之间互不干扰（广播模式）。\n\n### Kafka 为什么这么火？（特点）\n\n1.  **高吞吐量（High Throughput）**：\n    - 它每秒可以处理**百万级**的消息。即便是在普通的硬件上，它的性能也非常惊人。\n    - *原理：使用了顺序读写磁盘（Sequential I/O）和零拷贝（Zero Copy）技术。*\n2.  **持久化（Durability）**：\n    - 数据存储在磁盘上，不会因为程序挂掉而丢失。你可以设置数据保留 7 天、30 天甚至永久。\n3.  **可扩展性（Scalability）**：\n    - 需要处理更多数据？加服务器（Broker）就行，系统会自动重新平衡。\n4.  **解耦（Decoupling）**：\n    - 生产者只管发，不需要知道谁在收。这让微服务架构变得非常灵活。\n\n### Kafka 主要用来做什么？（应用场景）\n\n1.  **日志收集系统**：\n    - 这是 Kafka 最初的用途。把成千上万台服务器的日志统一收集起来，发送到 Kafka，然后由后端系统（如 ELK Stack）去分析。\n2.  **用户活动跟踪**：\n    - 记录用户在网站上的每一次点击、浏览、搜索。这些数据量巨大，Kafka 可以轻松抗住，然后推给推荐系统做实时推荐。\n3.  **微服务通信**：\n    - 服务 A 完成了一个任务，发个消息给 Kafka，服务 B 和服务 C 订阅这个消息并分别执行后续操作（比如：用户下单 -&gt; 发消息 -&gt; 库存服务减库存 + 积分服务加积分）。\n4.  **实时流处理**：\n    - 结合 Flink、Spark Streaming 或 Kafka Streams，对数据进行实时的计算（比如实时监控股票价格、实时反欺诈检测）。\n\n## 二、下载\n\n[Kafka下载](https://archive.apache.org/dist/kafka/)\n\n&amp;emsp;&amp;emsp;自行选择版本,本文以3.2.0版本为例，且不使用zookeeper，前面的2.12以及2.13表示scala的版本，后面的3.2.0表示kafka的版本\n\n## 三、安装\n\n- 解压下载下来的压缩包\n    ```shell\n    tar -zxvf kafka_2.12-3.2.0.tgz\n    ```\n\n\n    &lt;details&gt;\n    &lt;summary&gt; 如果使用zookeeper进行服务管理，则可跳过这段&lt;/summary&gt;\n    \n    1. 使用`kafka-storage`脚本为集群生成一个id，这个id将在同一个集群中所有实例使用\n\n        ```shell\n        ./bin/kafka-storage.sh random-uuid\n        ```\n    \n    2. 格式化存储目录 **（注意：如果使用kraft做服务管理的话就要使用config目录下的kraft目录下的`server.properties`配置文件）**\n\n        ```shell\n         ./bin/kafka-storage.sh format -t &lt;uuid&gt; -c ./config/kraft/server.properties\n        ```\n    \n    3. 如果有多实例，则需要都操作一遍步骤1和步骤2，可自行编写脚本进行处理\n    \n    &lt;/details&gt;\n \n\n- 启动 KafkaServer,`-daemon` 表示在后台启动，不加此参数 KafkaServer 将在控制台关闭的时候停止\n  ```shell\n    bin/kafka-server-start.sh &lt;-daemon&gt;  config/kraft/server.properties\n  ```\n\n## 四、测试\n\n1. 创建一个topic（下面指令将创建一个 topic 名称为 `foo`，分区数(`partitions`)为1，副本数(`replication-factor`)为2）\n   ```shell\n    bin/kafka-topics.sh --create --topic foo --partitions 1 --replication-factor 2 --bootstrap-server ip:port\n   ```\n2. 启动消息消费者，用于测试消息是否能成功接收（通过下面的指令启动的控制台消费者将监听topic名称为 `foo`的主题）\n   ```shell\n    bin/kafka-console-consumer.sh --bootstrap-server ip:port --topic foo\n   ```\n3. 启动消息生产者，配合消息消费者测试消息是否能成功发送（通过下面的指令启动的控制台生产者将向topic名称为 `foo`的主题发送消息）\n   ```shell\n    bin/kafka-console-producer.sh --bootstrap-server ip:port --topic foo\n   ```&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/kafka-install.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/kafka.png&quot;]]],&quot;digest&quot;:[0,&quot;ea3fec6f1cfa201c&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;kafka安装部署测试\&quot;&gt;Kafka安装、部署、测试&lt;/h1&gt;\n&lt;h2 id=\&quot;一介绍\&quot;&gt;一、介绍&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;strong&gt;Apache Kafka&lt;/strong&gt; 是一个&lt;strong&gt;分布式流处理平台&lt;/strong&gt;（Distributed Streaming Platform），它最初由 LinkedIn 公司开发，后来贡献给了 Apache 基金会。&lt;br&gt;\n      简单来说，Kafka 经常被归类为“&lt;strong&gt;消息队列&lt;/strong&gt;”（Message Queue, MQ）的一种，但它的功能和性能远超传统的消息队列。&lt;br&gt;\n      为了让你更容易理解，我们可以分三个层面来讲：通俗比喻、核心概念、以及它主要用来做什么。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\&quot;通俗比喻kafka-是什么\&quot;&gt;通俗比喻：Kafka 是什么？&lt;/h3&gt;\n&lt;p&gt;你可以把 Kafka 想象成一个&lt;strong&gt;巨大的、分布式的、极高性能的“日志记录本”&lt;/strong&gt;。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;生产者（Producer）&lt;/strong&gt;：就像是负责写日记的人。不管是网站的点击流、银行的转账记录，还是服务器的报错日志，他们只管往这个本子的末尾疯狂地写数据。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Kafka 集群（Broker）&lt;/strong&gt;：就是负责保管这些日志本的图书管理员。为了防止本子写满了或者丢失，管理员会把本子撕成几份（分区），甚至复印好几份（副本）存在不同的柜子（服务器）里。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;消费者（Consumer）&lt;/strong&gt;：就像是来阅读日记的人。\n&lt;ul&gt;\n&lt;li&gt;传统的信件（传统MQ）通常是“你看完就销毁了”。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Kafka 的特点是&lt;/strong&gt;：你看完了，日志还在那里。你可以现在看，也可以明天看，甚至可以让另一个人从头再看一遍。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\&quot;核心技术概念\&quot;&gt;核心技术概念&lt;/h3&gt;\n&lt;p&gt;如果你是技术人员，以下几个术语是必须掌握的：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Topic（主题）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;数据的分类。比如“用户注册数据”是一个 Topic，“订单数据”是另一个 Topic。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Partition（分区）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;为了实现高性能，一个 Topic 会被切分成多个 Partition。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;作用&lt;/strong&gt;：并发读写。比如一个 Topic 有 3 个分区，理论上就可以同时有 3 个人并行写入，速度提升 3 倍。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Producer（生产者）&lt;/strong&gt; &amp;#x26; &lt;strong&gt;Consumer（消费者）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;发消息的和收消息的客户端。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Broker（代理/服务器）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;运行 Kafka 进程的服务器节点。一个 Kafka 集群由多个 Broker 组成。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Consumer Group（消费者组）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;这是 Kafka 的精髓。一个组内有多个消费者，它们配合起来消费一个 Topic。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;规则&lt;/strong&gt;：组内的消费者不会重复消费同一条消息（负载均衡）。不同组之间互不干扰（广播模式）。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\&quot;kafka-为什么这么火特点\&quot;&gt;Kafka 为什么这么火？（特点）&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;高吞吐量（High Throughput）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;它每秒可以处理&lt;strong&gt;百万级&lt;/strong&gt;的消息。即便是在普通的硬件上，它的性能也非常惊人。&lt;/li&gt;\n&lt;li&gt;&lt;em&gt;原理：使用了顺序读写磁盘（Sequential I/O）和零拷贝（Zero Copy）技术。&lt;/em&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;持久化（Durability）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;数据存储在磁盘上，不会因为程序挂掉而丢失。你可以设置数据保留 7 天、30 天甚至永久。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;可扩展性（Scalability）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;需要处理更多数据？加服务器（Broker）就行，系统会自动重新平衡。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;解耦（Decoupling）&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;生产者只管发，不需要知道谁在收。这让微服务架构变得非常灵活。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\&quot;kafka-主要用来做什么应用场景\&quot;&gt;Kafka 主要用来做什么？（应用场景）&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;日志收集系统&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;这是 Kafka 最初的用途。把成千上万台服务器的日志统一收集起来，发送到 Kafka，然后由后端系统（如 ELK Stack）去分析。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;用户活动跟踪&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;记录用户在网站上的每一次点击、浏览、搜索。这些数据量巨大，Kafka 可以轻松抗住，然后推给推荐系统做实时推荐。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;微服务通信&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;服务 A 完成了一个任务，发个消息给 Kafka，服务 B 和服务 C 订阅这个消息并分别执行后续操作（比如：用户下单 -&gt; 发消息 -&gt; 库存服务减库存 + 积分服务加积分）。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;实时流处理&lt;/strong&gt;：\n&lt;ul&gt;\n&lt;li&gt;结合 Flink、Spark Streaming 或 Kafka Streams，对数据进行实时的计算（比如实时监控股票价格、实时反欺诈检测）。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;二下载\&quot;&gt;二、下载&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;https://archive.apache.org/dist/kafka/\&quot; rel=\&quot;nofollow noopener noreferrer\&quot; target=\&quot;_blank\&quot;&gt;Kafka下载&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;  自行选择版本,本文以3.2.0版本为例，且不使用zookeeper，前面的2.12以及2.13表示scala的版本，后面的3.2.0表示kafka的版本&lt;/p&gt;\n&lt;h2 id=\&quot;三安装\&quot;&gt;三、安装&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;解压下载下来的压缩包&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;tar&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -zxvf&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kafka_2.12-3.2.0.tgz&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n  &lt;details&gt;\n  &lt;summary&gt; 如果使用zookeeper进行服务管理，则可跳过这段&lt;/summary&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;使用&lt;code&gt;kafka-storage&lt;/code&gt;脚本为集群生成一个id，这个id将在同一个集群中所有实例使用&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;./bin/kafka-storage.sh&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; random-uuid&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;格式化存储目录 &lt;strong&gt;（注意：如果使用kraft做服务管理的话就要使用config目录下的kraft目录下的&lt;code&gt;server.properties&lt;/code&gt;配置文件）&lt;/strong&gt;&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; ./bin/kafka-storage.sh&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; format&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -t&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; &amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;uui&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;d&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;&gt;&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -c&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; ./config/kraft/server.properties&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;如果有多实例，则需要都操作一遍步骤1和步骤2，可自行编写脚本进行处理&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n  &lt;/details&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;启动 KafkaServer,&lt;code&gt;-daemon&lt;/code&gt; 表示在后台启动，不加此参数 KafkaServer 将在控制台关闭的时候停止&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;  bin/kafka-server-start.sh&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; &amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;-daemo&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;n&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;&gt;&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;  config/kraft/server.properties&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;四测试\&quot;&gt;四、测试&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;创建一个topic（下面指令将创建一个 topic 名称为 &lt;code&gt;foo&lt;/code&gt;，分区数(&lt;code&gt;partitions&lt;/code&gt;)为1，副本数(&lt;code&gt;replication-factor&lt;/code&gt;)为2）\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; bin/kafka-topics.sh&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --create&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --topic&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; foo&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --partitions&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 1&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --replication-factor&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 2&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --bootstrap-server&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; ip:port&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;启动消息消费者，用于测试消息是否能成功接收（通过下面的指令启动的控制台消费者将监听topic名称为 &lt;code&gt;foo&lt;/code&gt;的主题）\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; bin/kafka-console-consumer.sh&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --bootstrap-server&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; ip:port&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --topic&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; foo&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;li&gt;启动消息生产者，配合消息消费者测试消息是否能成功发送（通过下面的指令启动的控制台生产者将向topic名称为 &lt;code&gt;foo&lt;/code&gt;的主题发送消息）\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; bin/kafka-console-producer.sh&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --bootstrap-server&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; ip:port&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --topic&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; foo&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;/ol&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,1],&quot;slug&quot;:[0,&quot;kafka安装部署测试&quot;],&quot;text&quot;:[0,&quot;Kafka安装、部署、测试&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;一介绍&quot;],&quot;text&quot;:[0,&quot;一、介绍&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;通俗比喻kafka-是什么&quot;],&quot;text&quot;:[0,&quot;通俗比喻：Kafka 是什么？&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;核心技术概念&quot;],&quot;text&quot;:[0,&quot;核心技术概念&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;kafka-为什么这么火特点&quot;],&quot;text&quot;:[0,&quot;Kafka 为什么这么火？（特点）&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;kafka-主要用来做什么应用场景&quot;],&quot;text&quot;:[0,&quot;Kafka 主要用来做什么？（应用场景）&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;二下载&quot;],&quot;text&quot;:[0,&quot;二、下载&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;三安装&quot;],&quot;text&quot;:[0,&quot;三、安装&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;四测试&quot;],&quot;text&quot;:[0,&quot;四、测试&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Kafka安装、部署、测试&quot;],&quot;description&quot;:[0,&quot;Kafka安装、部署、测试&quot;],&quot;createdAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/kafka.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Kafka&quot;],[0,&quot;Linux&quot;]]],&quot;tags&quot;:[1,[[0,&quot;kafka&quot;],[0,&quot;linux&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;gmp&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Golang GMP调度模型流程&quot;],&quot;description&quot;:[0,&quot;Golang GMP调度模型流程&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-01-08T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-08T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/golang.BpeTWk16.png&quot;],&quot;width&quot;:[0,780],&quot;height&quot;:[0,496],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;],[0,&quot;枚举&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;## 一、什么是GMP?\n\n&gt; GMP 是 Go 语言的调度模型，是 Go 语言的并发模型。\n\n![gmp-model.png](/assets/uploads/gmp-model.png)\n\n源码：[GMP](https://github.com/golang/go/blob/master/src/runtime/runtime2.go)\n\n## 二、GMP 模型\n\n&gt; GMP 模型 是 Go 语言调度器的核心模型，它是 Go 语言调度器的基础。\n\n| 组件           | 说明                                                                       |\n|--------------|--------------------------------------------------------------------------|\n| G(Goroutine) | 调度的基本单位，由Go的运行时管理，比OS线程更轻量的协程，包含栈和相关上下文的信息，在Golang中 使用 `go` 开启一个协程       |\n| M(Machine)   | 代表一个执行线程或系统线程，是真正工作的单位，M中保存自身使用的栈信息、当前M正在执行的G的信息与其绑定的P的信息                |\n| P(Processor) | 代表一个逻辑处理器，维护了一个处于可运行状态的G队列，每一个M都有一个P对应关联，P的数量是固定的，由GOMAXPROCS决定，默认为CPU核数 |\n\n- **本地运行队列（Local Runnable Queue，LRQ）**：存放当前 P 的 G，每个 P 都有一个本地队列， 用于存放当前 P 等待和正在运行的\n  G，每个 P 的本地队列中最多存放 256 个 G 。创建 G 时，会优先放入本地队列，如果本地队列满了，则会将队列中一半的 G 移动到全局队列中。\n- **全局运行队列（Global Runnable Queue，GRQ）**：存放正在等待的 G，即没有在LRQ中的 G，\n- **M 的数量是动态的，由调度器决定**。根据当前系统的负载自动调整，M 像运行任务，就需要获取 P ，如何没有 P 那 M 就会阻塞。如果\n  P 的本地队列为空，M 就会从全局队列中获取 G 放入本地队列，如果全局队列也为空，M 就会从其他随机一个 P 的本地队列中获取一半的\n  G 放到当前 P 的本地队列中。\n\n## 三、G、M、P 各自的特点：\n\n### G(Goroutine)\n\n- 当 goroutine 被调离 CPU 时，调度器负责把 CPU 寄存器的值保存在 g 对象的成员变量之中。 当 goroutine 被调度起来运行时，调度器又负责把\n  g 对象的成员变量所保存的寄存器值恢复到 CPU 的寄存器。\n\n### M(Machine)\n\n- 设置M的数量\n  - runtime/debug 中的 SetMaxThreads 函数，设置 M 的最大数量\n\n- M:N模型\n  - M 个 goroutines (G) 被调度到 N 个内核线程 (M) 上执行，这些线程运行在最多 `GOMAXPROCS` 个逻辑处理器 (P) 上。\n\n  - P 负责管理 G 的本地运行队列（*LRQ*），每个 P 必须绑定一个 M 才能执行 G。如果某个 M 阻塞（如系统调用），与该 M 绑定的 P\n    会解绑，并由其他空闲的 M（或新建的 M）接管这个 P，继续执行其 LRQ 中的 G。\n\n- M阻塞和G阻塞的区别\n\n  | 维度\t  | M 阻塞（线程级）         | G 阻塞（协程级）                  |  \n    |------|-------------------|----------------------------|  \n  | 触发原因 | 系统调用、CGO 等底层操作    | Channel、锁、Gosched() 等用户态操作 |  \n  | 阻塞对象 | 内核线程（M）\t          | Goroutine（G）               |  \n  | 调度影响 | P 与 M 解绑，可能创建新 M\t | G 被移出运行队列，M 执行其他 G         |  \n  | 恢复机制 | 系统调用完成后重新绑定 P\t    | 条件满足后重新加入运行队列              |  \n  | 性能代价 | 高（线程切换、内核态开销）     | 低（用户态调度，无线程切换）             |  \n\n\n- M 的自旋状态\n  &gt; 自旋（**Spinning**） 是指 M 在暂时没有可执行的 G（**Goroutine**）时，不立即进入休眠，而是空转循环（忙等待），主动寻找可运行的\n  G。 自旋的 M 会占用 CPU 资源，但避免了线程休眠和重新唤醒的代价（系统调用、上下文切换等）。\n\n  一个 M 进入自旋状态通常需要满足以下条件：\n  - 当前 M 绑定的 P 的本地运行队列（LRQ）为空，且无法立即从全局队列（GRQ）或其他 P 偷取到 G。\n  - 仍有其他 P 正在运行 G（即系统整体有任务可执行，只是当前 P 暂时无任务）。\n  - 自旋的 M 数量未超过阈值（默认最多 GOMAXPROCS/2 个自旋 M，防止过度占用 CPU）。\n\n  自旋的 M 会持续执行以下操作：\n  - 检查全局队列（GRQ）：\n  - 定期扫描 GRQ，看是否有新加入的 G 可执行。\n  - 尝试从其他 P 偷取 G（Work Stealing）：\n  - 随机选择其他 P，从其 LRQ 中偷取一半的 G（最少偷 1 个）。\n  - 检查网络轮询器（Netpoller）： 查看是否有就绪的网络 I/O 相关的 G 可恢复执行。\n  - 自旋超时后休眠： 如果自旋一段时间（约 10ms）仍找不到 G，M 会退出自旋状态并休眠。\n\n### P(Processor)\n\n- 当一个线程阻塞的时候，将和它绑定的 P 上的 G 转移到其他线程。Go scheduler 会启动一个后台线程 sysmon，用来检测长时间（超过\n  10 ms）运行的 goroutine，将其调度到 global runqueues。这是一个全局的 runqueue，优先级比较低，以示惩罚。\n- 设置P的数量\n  - P 的数量是固定的，由启动时环境变量 `GOMAXPROCS` 或者是由 `runtime` 的方法 `GOMAXPROCS()` 决定。这意味着在程序执行的任意时刻都只有\n    `GOMAXPROCS` 个 goroutine 在同时运行。\n\n### P 和 M 的创建时机。\n\n- P 在系统启动根据`GOMAXPROCES` 创建 n 个 P。\n- M 在 没有足够的 M 来关联 P 并运行其中可运行的 G 时，例如：M 在阻塞状态，但是 P 中还有空闲任务，就会去寻找空闲的 M ，如果没有空闲的\n  M，就会创建新的 M。\n\n## 四、GMP调度流程\n\n### 什么是Go的调度器？\n\n![go-scheduler.png](/assets/uploads/go-scheduler.png)\n\n源码：[proc.go](https://github.com/golang/go/blob/master/src/runtime/proc.go)\n\n- Go scheduler 是 Go runtime 的一部分，它内嵌在 Go 程序里，和 Go 程序一起运行。因此它运行在用户空间，在 kernel 的上一层。\n- 程序运行时会启动一些 G：垃圾回收的 G，执行调度的 G，运行用户代码的 G (**main** 也是一个 G )；并且会创建一个 M 用来开始 G\n  的运行。随着时间的推移，更多的 G 会被创建出来，更多的 M 也会被创建出来。\n\n### 调度器的设计策略\n\n- **复用线程**：避免频繁的创建、销毁线程。\n- **work stealing机制(盗用机制)**：当本地运行队列为空时，尝试从其他 P 的运行队列偷取 G，而不是直接销毁线程 (M)。\n- **hand off 机制(交接机制)**：当本线程因为 G 进行系统调用阻塞时，线程释放绑定的 P，把 P 转移给其他空闲的线程执行。\n- **并行**：通过设置 `GOMAXPROCS` 配置 P 的数量，从而达到并行的目的，当 P 达到CPU核心数时，达到最大的并行度。\n- **抢占式调度**：在 coroutine 中，需要等待一个协程主动让出CPU才能执行下一个协程，Go规定每个 goroutine 只会持有CPU\n  10ms，防止其他协程被饿死。\n\n### 调度器的生命周期\n\n![go-schedule-life.png](/assets/uploads/go-schedule-life.png)\n\n#### M0 和 G0\n\n- M0 是 程序启动后编号为0的主线程，这个 M 对应的实例会在全局变量 runtime.m0(定义在 proc.go 的 m0) 中，M0 负责执行初始化操作和启动第一个\n  G。\n- G0 是每次启动一个 M 都会第一个创建的 gourtine，G0 仅用于负责调度的 G，G0 不指向任何可执行的函数，每个 M 都会有一个自己的\n  G0。在调度或系统调用时会使用 G0 的栈空间，全局变量的 G0 (proc.go 的 g0) 是 M0 的 G0。\n\n### go func() 的调度流程\n\n![gofunc-workflow.png](/assets/uploads/gofunc-workflow.png)\n\n- 编译器将`go func()` 转换成对 `runtime.newproc` 的调用(在runtime/proc.go 中)。\n- **newproc** : 切换到 g0 栈调用 `newproc1`。\n- **newproc1** :\n  - 从 `p.gfree` 中 获取一个空闲的g，如果没有就从全局队列中获取一批(proc.go 的 `gfget` 函数)。\n  - 初始化 G 的栈和上下文（SP, PC）。这里将 PC 设置为了 `goexit`，以便 G 跑完后能自动退出。\n- 调用 `runqput` 将新 G 放入当前 P 的本地队列。如果满了，则放入全局队列。\n- 尝试再加一个P来执行G。当 G 可运行（newproc、ready）时调用(proc.go 的 wakep 函数)\n\n### 代码演示\n\n```go\npackage main\n\nimport \&quot;fmt\&quot;\n\nfunc main() {\n    fmt.Println(\&quot;Hello world\&quot;)\n}\n```\n   1. runtime 创建最初的线程 m0 和 goroutine g0，并把 2 者关联。\n   2. 调度器初始化：初始化 m0、栈、垃圾回收，以及创建和初始化由 `GOMAXPROCS` 个 P 构成的 P 列表。\n   3. 示例代码中的 main 函数是 `main.main`，`runtime` 中也有 1 个 main 函数 —— `runtime.main`，代码经过编译后，`runtime.main` 会调用 `main.main`，程序启动时会为 `runtime.main` 创建 goroutine，称它为 main goroutine 吧，然后把 main goroutine 加入到 P 的本地队列。\n   4. 启动 m0，m0 已经绑定了 P，会从 P 的本地队列获取 G，获取到 main goroutine。\n   5. G 拥有栈，M 根据 G 中的栈信息和调度信息设置运行环境。\n   6. M 运行 G。\n   7. G 退出，再次回到 M 获取可运行的 G，这样重复下去，直到 `main.main` 退出，`runtime.main` 执行 Defer 和 Panic 处理，或调用 `runtime.exit` 退出程序。\n\n**感兴趣可以追踪一下 runtime.main()** \n\n### 调度循环\n&gt; Go 调度器的核心逻辑几乎全都在 **`src/runtime/proc.go`** 文件中。  \n\n**`schedule`** 函数，它是整个调度器的核心。  \n\n   大致流程如下：\n\n1.  **检查全局队列**：为了公平，每隔 61 次调度，会去全局队列（`sched.runq`）拿一个 G。\n2.  **检查本地队列**：调用 `runqget()` 从当前 P 的本地队列获取 G。\n3.  **工作窃取 (Work Stealing)**：如果本地没有，调用 `findrunnable()`。这个函数极其复杂，它会尝试从全局队列拿、从网络轮询器（Netpoller）拿、或者从其他 P 的队列里“偷”一半 G 过来。\n4.  **执行**：找到 G 后，调用 `execute(g, inheritTime)`。\n\n\n### 上下文切换\nGo 如何从“调度逻辑”切换到“用户代码”？\n根据架构不同，go 提供了不同的汇编源码，以 `asm_amd64.s` 为例\n\n**gogo 函数**\n  - 在 `proc.go` 的 `execute()` 函数最后，会调用 `gogo(&amp;g.sched)`。`gogo` 是一个汇编函数。\n  - 它利用 `g.sched` 中保存的信息，恢复寄存器（RSP, RIP 等）。\n  - 最后一条指令是 `JMP`(arm 的跳转指令是 B ，代表无条件跳转，B. 代表有条件跳转)，直接跳到用户代码的位置。至此，由 G 开始执行。\n  - 当 G 需要让出 CPU（比如调用了 `time.Sleep` 或 阻塞在 Channel 上）时，不能直接切过去，必须先切回 `g0`。\n\n**mcall 函数**\n  - `mcall(fn)` 也是汇编实现。\n  - 它保存当前 G 的上下文到 `g.sched`。\n  - **切换栈指针 (SP)** 到 `g0` 的栈。\n  - 在 `g0` 栈上执行回调函数 `fn`（例如 `park_m`），最终再次调用 `schedule()` 进行下一轮调度。\n\n\n\n\n&lt;br/&gt;\n&lt;br/&gt;\n&lt;br/&gt;\n\n# 参考  \n[GMP 原理与调度](https://www.topgoer.com/%E5%B9%B6%E5%8F%91%E7%BC%96%E7%A8%8B/GMP%E5%8E%9F%E7%90%86%E4%B8%8E%E8%B0%83%E5%BA%A6.html)&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/gmp.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/golang.png&quot;]]],&quot;digest&quot;:[0,&quot;0bf5cfc8858c5588&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;一什么是gmp\&quot;&gt;一、什么是GMP?&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;GMP 是 Go 语言的调度模型，是 Go 语言的并发模型。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/gmp-model.png\&quot; alt=\&quot;gmp-model.png\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;源码：&lt;a href=\&quot;https://github.com/golang/go/blob/master/src/runtime/runtime2.go\&quot; rel=\&quot;nofollow noopener noreferrer\&quot; target=\&quot;_blank\&quot;&gt;GMP&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\&quot;二gmp-模型\&quot;&gt;二、GMP 模型&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;GMP 模型 是 Go 语言调度器的核心模型，它是 Go 语言调度器的基础。&lt;/p&gt;\n&lt;/blockquote&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;组件&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;G(Goroutine)&lt;/td&gt;&lt;td&gt;调度的基本单位，由Go的运行时管理，比OS线程更轻量的协程，包含栈和相关上下文的信息，在Golang中 使用 &lt;code&gt;go&lt;/code&gt; 开启一个协程&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;M(Machine)&lt;/td&gt;&lt;td&gt;代表一个执行线程或系统线程，是真正工作的单位，M中保存自身使用的栈信息、当前M正在执行的G的信息与其绑定的P的信息&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;P(Processor)&lt;/td&gt;&lt;td&gt;代表一个逻辑处理器，维护了一个处于可运行状态的G队列，每一个M都有一个P对应关联，P的数量是固定的，由GOMAXPROCS决定，默认为CPU核数&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;本地运行队列（Local Runnable Queue，LRQ）&lt;/strong&gt;：存放当前 P 的 G，每个 P 都有一个本地队列， 用于存放当前 P 等待和正在运行的\nG，每个 P 的本地队列中最多存放 256 个 G 。创建 G 时，会优先放入本地队列，如果本地队列满了，则会将队列中一半的 G 移动到全局队列中。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;全局运行队列（Global Runnable Queue，GRQ）&lt;/strong&gt;：存放正在等待的 G，即没有在LRQ中的 G，&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;M 的数量是动态的，由调度器决定&lt;/strong&gt;。根据当前系统的负载自动调整，M 像运行任务，就需要获取 P ，如何没有 P 那 M 就会阻塞。如果\nP 的本地队列为空，M 就会从全局队列中获取 G 放入本地队列，如果全局队列也为空，M 就会从其他随机一个 P 的本地队列中获取一半的\nG 放到当前 P 的本地队列中。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;三gmp-各自的特点\&quot;&gt;三、G、M、P 各自的特点：&lt;/h2&gt;\n&lt;h3 id=\&quot;ggoroutine\&quot;&gt;G(Goroutine)&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;当 goroutine 被调离 CPU 时，调度器负责把 CPU 寄存器的值保存在 g 对象的成员变量之中。 当 goroutine 被调度起来运行时，调度器又负责把\ng 对象的成员变量所保存的寄存器值恢复到 CPU 的寄存器。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;mmachine\&quot;&gt;M(Machine)&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;设置M的数量&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;runtime/debug 中的 SetMaxThreads 函数，设置 M 的最大数量&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;M:N模型&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;M 个 goroutines (G) 被调度到 N 个内核线程 (M) 上执行，这些线程运行在最多 &lt;code&gt;GOMAXPROCS&lt;/code&gt; 个逻辑处理器 (P) 上。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;P 负责管理 G 的本地运行队列（&lt;em&gt;LRQ&lt;/em&gt;），每个 P 必须绑定一个 M 才能执行 G。如果某个 M 阻塞（如系统调用），与该 M 绑定的 P\n会解绑，并由其他空闲的 M（或新建的 M）接管这个 P，继续执行其 LRQ 中的 G。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;M阻塞和G阻塞的区别&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;维度&lt;/th&gt;&lt;th&gt;M 阻塞（线程级）&lt;/th&gt;&lt;th&gt;G 阻塞（协程级）&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;触发原因&lt;/td&gt;&lt;td&gt;系统调用、CGO 等底层操作&lt;/td&gt;&lt;td&gt;Channel、锁、Gosched() 等用户态操作&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;阻塞对象&lt;/td&gt;&lt;td&gt;内核线程（M）&lt;/td&gt;&lt;td&gt;Goroutine（G）&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;调度影响&lt;/td&gt;&lt;td&gt;P 与 M 解绑，可能创建新 M&lt;/td&gt;&lt;td&gt;G 被移出运行队列，M 执行其他 G&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;恢复机制&lt;/td&gt;&lt;td&gt;系统调用完成后重新绑定 P&lt;/td&gt;&lt;td&gt;条件满足后重新加入运行队列&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;性能代价&lt;/td&gt;&lt;td&gt;高（线程切换、内核态开销）&lt;/td&gt;&lt;td&gt;低（用户态调度，无线程切换）&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;M 的自旋状态&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;自旋（&lt;strong&gt;Spinning&lt;/strong&gt;） 是指 M 在暂时没有可执行的 G（&lt;strong&gt;Goroutine&lt;/strong&gt;）时，不立即进入休眠，而是空转循环（忙等待），主动寻找可运行的\nG。 自旋的 M 会占用 CPU 资源，但避免了线程休眠和重新唤醒的代价（系统调用、上下文切换等）。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;一个 M 进入自旋状态通常需要满足以下条件：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;当前 M 绑定的 P 的本地运行队列（LRQ）为空，且无法立即从全局队列（GRQ）或其他 P 偷取到 G。&lt;/li&gt;\n&lt;li&gt;仍有其他 P 正在运行 G（即系统整体有任务可执行，只是当前 P 暂时无任务）。&lt;/li&gt;\n&lt;li&gt;自旋的 M 数量未超过阈值（默认最多 GOMAXPROCS/2 个自旋 M，防止过度占用 CPU）。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;自旋的 M 会持续执行以下操作：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;检查全局队列（GRQ）：&lt;/li&gt;\n&lt;li&gt;定期扫描 GRQ，看是否有新加入的 G 可执行。&lt;/li&gt;\n&lt;li&gt;尝试从其他 P 偷取 G（Work Stealing）：&lt;/li&gt;\n&lt;li&gt;随机选择其他 P，从其 LRQ 中偷取一半的 G（最少偷 1 个）。&lt;/li&gt;\n&lt;li&gt;检查网络轮询器（Netpoller）： 查看是否有就绪的网络 I/O 相关的 G 可恢复执行。&lt;/li&gt;\n&lt;li&gt;自旋超时后休眠： 如果自旋一段时间（约 10ms）仍找不到 G，M 会退出自旋状态并休眠。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;pprocessor\&quot;&gt;P(Processor)&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;当一个线程阻塞的时候，将和它绑定的 P 上的 G 转移到其他线程。Go scheduler 会启动一个后台线程 sysmon，用来检测长时间（超过\n10 ms）运行的 goroutine，将其调度到 global runqueues。这是一个全局的 runqueue，优先级比较低，以示惩罚。&lt;/li&gt;\n&lt;li&gt;设置P的数量\n&lt;ul&gt;\n&lt;li&gt;P 的数量是固定的，由启动时环境变量 &lt;code&gt;GOMAXPROCS&lt;/code&gt; 或者是由 &lt;code&gt;runtime&lt;/code&gt; 的方法 &lt;code&gt;GOMAXPROCS()&lt;/code&gt; 决定。这意味着在程序执行的任意时刻都只有\n&lt;code&gt;GOMAXPROCS&lt;/code&gt; 个 goroutine 在同时运行。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;p-和-m-的创建时机\&quot;&gt;P 和 M 的创建时机。&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;P 在系统启动根据&lt;code&gt;GOMAXPROCES&lt;/code&gt; 创建 n 个 P。&lt;/li&gt;\n&lt;li&gt;M 在 没有足够的 M 来关联 P 并运行其中可运行的 G 时，例如：M 在阻塞状态，但是 P 中还有空闲任务，就会去寻找空闲的 M ，如果没有空闲的\nM，就会创建新的 M。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;四gmp调度流程\&quot;&gt;四、GMP调度流程&lt;/h2&gt;\n&lt;h3 id=\&quot;什么是go的调度器\&quot;&gt;什么是Go的调度器？&lt;/h3&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/go-scheduler.png\&quot; alt=\&quot;go-scheduler.png\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;源码：&lt;a href=\&quot;https://github.com/golang/go/blob/master/src/runtime/proc.go\&quot; rel=\&quot;nofollow noopener noreferrer\&quot; target=\&quot;_blank\&quot;&gt;proc.go&lt;/a&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Go scheduler 是 Go runtime 的一部分，它内嵌在 Go 程序里，和 Go 程序一起运行。因此它运行在用户空间，在 kernel 的上一层。&lt;/li&gt;\n&lt;li&gt;程序运行时会启动一些 G：垃圾回收的 G，执行调度的 G，运行用户代码的 G (&lt;strong&gt;main&lt;/strong&gt; 也是一个 G )；并且会创建一个 M 用来开始 G\n的运行。随着时间的推移，更多的 G 会被创建出来，更多的 M 也会被创建出来。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;调度器的设计策略\&quot;&gt;调度器的设计策略&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;复用线程&lt;/strong&gt;：避免频繁的创建、销毁线程。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;work stealing机制(盗用机制)&lt;/strong&gt;：当本地运行队列为空时，尝试从其他 P 的运行队列偷取 G，而不是直接销毁线程 (M)。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;hand off 机制(交接机制)&lt;/strong&gt;：当本线程因为 G 进行系统调用阻塞时，线程释放绑定的 P，把 P 转移给其他空闲的线程执行。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;并行&lt;/strong&gt;：通过设置 &lt;code&gt;GOMAXPROCS&lt;/code&gt; 配置 P 的数量，从而达到并行的目的，当 P 达到CPU核心数时，达到最大的并行度。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;抢占式调度&lt;/strong&gt;：在 coroutine 中，需要等待一个协程主动让出CPU才能执行下一个协程，Go规定每个 goroutine 只会持有CPU\n10ms，防止其他协程被饿死。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;调度器的生命周期\&quot;&gt;调度器的生命周期&lt;/h3&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/go-schedule-life.png\&quot; alt=\&quot;go-schedule-life.png\&quot;&gt;&lt;/p&gt;\n&lt;h4 id=\&quot;m0-和-g0\&quot;&gt;M0 和 G0&lt;/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;M0 是 程序启动后编号为0的主线程，这个 M 对应的实例会在全局变量 runtime.m0(定义在 proc.go 的 m0) 中，M0 负责执行初始化操作和启动第一个\nG。&lt;/li&gt;\n&lt;li&gt;G0 是每次启动一个 M 都会第一个创建的 gourtine，G0 仅用于负责调度的 G，G0 不指向任何可执行的函数，每个 M 都会有一个自己的\nG0。在调度或系统调用时会使用 G0 的栈空间，全局变量的 G0 (proc.go 的 g0) 是 M0 的 G0。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;go-func-的调度流程\&quot;&gt;go func() 的调度流程&lt;/h3&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/gofunc-workflow.png\&quot; alt=\&quot;gofunc-workflow.png\&quot;&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;编译器将&lt;code&gt;go func()&lt;/code&gt; 转换成对 &lt;code&gt;runtime.newproc&lt;/code&gt; 的调用(在runtime/proc.go 中)。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;newproc&lt;/strong&gt; : 切换到 g0 栈调用 &lt;code&gt;newproc1&lt;/code&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;newproc1&lt;/strong&gt; :\n&lt;ul&gt;\n&lt;li&gt;从 &lt;code&gt;p.gfree&lt;/code&gt; 中 获取一个空闲的g，如果没有就从全局队列中获取一批(proc.go 的 &lt;code&gt;gfget&lt;/code&gt; 函数)。&lt;/li&gt;\n&lt;li&gt;初始化 G 的栈和上下文（SP, PC）。这里将 PC 设置为了 &lt;code&gt;goexit&lt;/code&gt;，以便 G 跑完后能自动退出。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;调用 &lt;code&gt;runqput&lt;/code&gt; 将新 G 放入当前 P 的本地队列。如果满了，则放入全局队列。&lt;/li&gt;\n&lt;li&gt;尝试再加一个P来执行G。当 G 可运行（newproc、ready）时调用(proc.go 的 wakep 函数)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;代码演示\&quot;&gt;代码演示&lt;/h3&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;package&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; main&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;import&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; \&quot;&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;fmt&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; main&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;() {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    fmt.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Println&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;Hello world\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;ol&gt;\n&lt;li&gt;runtime 创建最初的线程 m0 和 goroutine g0，并把 2 者关联。&lt;/li&gt;\n&lt;li&gt;调度器初始化：初始化 m0、栈、垃圾回收，以及创建和初始化由 &lt;code&gt;GOMAXPROCS&lt;/code&gt; 个 P 构成的 P 列表。&lt;/li&gt;\n&lt;li&gt;示例代码中的 main 函数是 &lt;code&gt;main.main&lt;/code&gt;，&lt;code&gt;runtime&lt;/code&gt; 中也有 1 个 main 函数 —— &lt;code&gt;runtime.main&lt;/code&gt;，代码经过编译后，&lt;code&gt;runtime.main&lt;/code&gt; 会调用 &lt;code&gt;main.main&lt;/code&gt;，程序启动时会为 &lt;code&gt;runtime.main&lt;/code&gt; 创建 goroutine，称它为 main goroutine 吧，然后把 main goroutine 加入到 P 的本地队列。&lt;/li&gt;\n&lt;li&gt;启动 m0，m0 已经绑定了 P，会从 P 的本地队列获取 G，获取到 main goroutine。&lt;/li&gt;\n&lt;li&gt;G 拥有栈，M 根据 G 中的栈信息和调度信息设置运行环境。&lt;/li&gt;\n&lt;li&gt;M 运行 G。&lt;/li&gt;\n&lt;li&gt;G 退出，再次回到 M 获取可运行的 G，这样重复下去，直到 &lt;code&gt;main.main&lt;/code&gt; 退出，&lt;code&gt;runtime.main&lt;/code&gt; 执行 Defer 和 Panic 处理，或调用 &lt;code&gt;runtime.exit&lt;/code&gt; 退出程序。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;感兴趣可以追踪一下 runtime.main()&lt;/strong&gt;&lt;/p&gt;\n&lt;h3 id=\&quot;调度循环\&quot;&gt;调度循环&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Go 调度器的核心逻辑几乎全都在 &lt;strong&gt;&lt;code&gt;src/runtime/proc.go&lt;/code&gt;&lt;/strong&gt; 文件中。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;&lt;strong&gt;&lt;code&gt;schedule&lt;/code&gt;&lt;/strong&gt; 函数，它是整个调度器的核心。&lt;/p&gt;\n&lt;p&gt;大致流程如下：&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;检查全局队列&lt;/strong&gt;：为了公平，每隔 61 次调度，会去全局队列（&lt;code&gt;sched.runq&lt;/code&gt;）拿一个 G。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;检查本地队列&lt;/strong&gt;：调用 &lt;code&gt;runqget()&lt;/code&gt; 从当前 P 的本地队列获取 G。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;工作窃取 (Work Stealing)&lt;/strong&gt;：如果本地没有，调用 &lt;code&gt;findrunnable()&lt;/code&gt;。这个函数极其复杂，它会尝试从全局队列拿、从网络轮询器（Netpoller）拿、或者从其他 P 的队列里“偷”一半 G 过来。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;执行&lt;/strong&gt;：找到 G 后，调用 &lt;code&gt;execute(g, inheritTime)&lt;/code&gt;。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\&quot;上下文切换\&quot;&gt;上下文切换&lt;/h3&gt;\n&lt;p&gt;Go 如何从“调度逻辑”切换到“用户代码”？\n根据架构不同，go 提供了不同的汇编源码，以 &lt;code&gt;asm_amd64.s&lt;/code&gt; 为例&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;gogo 函数&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;在 &lt;code&gt;proc.go&lt;/code&gt; 的 &lt;code&gt;execute()&lt;/code&gt; 函数最后，会调用 &lt;code&gt;gogo(&amp;#x26;g.sched)&lt;/code&gt;。&lt;code&gt;gogo&lt;/code&gt; 是一个汇编函数。&lt;/li&gt;\n&lt;li&gt;它利用 &lt;code&gt;g.sched&lt;/code&gt; 中保存的信息，恢复寄存器（RSP, RIP 等）。&lt;/li&gt;\n&lt;li&gt;最后一条指令是 &lt;code&gt;JMP&lt;/code&gt;(arm 的跳转指令是 B ，代表无条件跳转，B. 代表有条件跳转)，直接跳到用户代码的位置。至此，由 G 开始执行。&lt;/li&gt;\n&lt;li&gt;当 G 需要让出 CPU（比如调用了 &lt;code&gt;time.Sleep&lt;/code&gt; 或 阻塞在 Channel 上）时，不能直接切过去，必须先切回 &lt;code&gt;g0&lt;/code&gt;。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;mcall 函数&lt;/strong&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;mcall(fn)&lt;/code&gt; 也是汇编实现。&lt;/li&gt;\n&lt;li&gt;它保存当前 G 的上下文到 &lt;code&gt;g.sched&lt;/code&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;切换栈指针 (SP)&lt;/strong&gt; 到 &lt;code&gt;g0&lt;/code&gt; 的栈。&lt;/li&gt;\n&lt;li&gt;在 &lt;code&gt;g0&lt;/code&gt; 栈上执行回调函数 &lt;code&gt;fn&lt;/code&gt;（例如 &lt;code&gt;park_m&lt;/code&gt;），最终再次调用 &lt;code&gt;schedule()&lt;/code&gt; 进行下一轮调度。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;br&gt;\n&lt;br&gt;\n&lt;br&gt;\n&lt;h1 id=\&quot;参考\&quot;&gt;参考&lt;/h1&gt;\n&lt;p&gt;&lt;a href=\&quot;https://www.topgoer.com/%E5%B9%B6%E5%8F%91%E7%BC%96%E7%A8%8B/GMP%E5%8E%9F%E7%90%86%E4%B8%8E%E8%B0%83%E5%BA%A6.html\&quot; rel=\&quot;nofollow noopener noreferrer\&quot; target=\&quot;_blank\&quot;&gt;GMP 原理与调度&lt;/a&gt;&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;一什么是gmp&quot;],&quot;text&quot;:[0,&quot;一、什么是GMP?&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;二gmp-模型&quot;],&quot;text&quot;:[0,&quot;二、GMP 模型&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;三gmp-各自的特点&quot;],&quot;text&quot;:[0,&quot;三、G、M、P 各自的特点：&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;ggoroutine&quot;],&quot;text&quot;:[0,&quot;G(Goroutine)&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;mmachine&quot;],&quot;text&quot;:[0,&quot;M(Machine)&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;pprocessor&quot;],&quot;text&quot;:[0,&quot;P(Processor)&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;p-和-m-的创建时机&quot;],&quot;text&quot;:[0,&quot;P 和 M 的创建时机。&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;四gmp调度流程&quot;],&quot;text&quot;:[0,&quot;四、GMP调度流程&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;什么是go的调度器&quot;],&quot;text&quot;:[0,&quot;什么是Go的调度器？&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;调度器的设计策略&quot;],&quot;text&quot;:[0,&quot;调度器的设计策略&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;调度器的生命周期&quot;],&quot;text&quot;:[0,&quot;调度器的生命周期&quot;]}],[0,{&quot;depth&quot;:[0,4],&quot;slug&quot;:[0,&quot;m0-和-g0&quot;],&quot;text&quot;:[0,&quot;M0 和 G0&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;go-func-的调度流程&quot;],&quot;text&quot;:[0,&quot;go func() 的调度流程&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;代码演示&quot;],&quot;text&quot;:[0,&quot;代码演示&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;调度循环&quot;],&quot;text&quot;:[0,&quot;调度循环&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;上下文切换&quot;],&quot;text&quot;:[0,&quot;上下文切换&quot;]}],[0,{&quot;depth&quot;:[0,1],&quot;slug&quot;:[0,&quot;参考&quot;],&quot;text&quot;:[0,&quot;参考&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Golang GMP调度模型流程&quot;],&quot;description&quot;:[0,&quot;Golang GMP调度模型流程&quot;],&quot;createdAt&quot;:[3,&quot;2026-01-08T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-08T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/golang.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;],[0,&quot;枚举&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true],&quot;showAuthor&quot;:[0,false]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;go-enum&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Go实现枚举&quot;],&quot;description&quot;:[0,&quot;使用Golang实现枚举类型&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/go-enum.B_idjXMN.png&quot;],&quot;width&quot;:[0,1024],&quot;height&quot;:[0,1024],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;],[0,&quot;枚举&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;# Go实现枚举\n\n## 一、前言\n\n&gt; 在日常开发中我们经常会遇到要使用枚举值的情况，但是Go语言中没有枚举，那么怎么可以在Go语言中使用上枚举呢？我们可以借助一些技巧来实现枚举。\n\n## 二、具体实现\n\n\n```go\n\ntype WeekDay int\n\nconst (\n    Monday WeekDay = 1\n    Tuesday WeekDay = 2\n    Wednesday WeekDay = 3\n    Thursday WeekDay = 4\n    Friday WeekDay = 5\n    Saturday WeekDay = 6\n    Sunday WeekDay = 7\n)\n```\n\n但是每个枚举项都要写一次类型声明，这样很麻烦，我们可以使用iota来简化这个过程\n\n```go \ntype WeekDay int\n\nconst (\n    Monday WeekDay = iota + 1\n    Tuesday\n    Wednesday\n    Thursday\n    Friday\n    Saturday\n    Sunday\n)\n```\n\n我们还可以为`WeekDay`添加一些自定义的方法\n\n```go\nfunc (day WeekDay) String() string {\n    return []string{\&quot;Monday\&quot;, \&quot;Tuesday\&quot;, \&quot;Wednesday\&quot;, \&quot;Thursday\&quot;, \&quot;Friday\&quot;, \&quot;Saturday\&quot;, \&quot;Sunday\&quot;}[day-1]\n}\n```\n\n\n这样我们就可以通过`day.String()`来获取枚举项的字符串值了\n\n## 三、代码示例\n\n```go\n// main.go\n\npackage main\n\nimport (\n    \&quot;fmt\&quot;\n)\n\ntype WeekDay int\n\nconst (\n    Monday WeekDay = iota + 1\n    Tuesday\n    Wednesday\n    Thursday\n    Friday\n    Saturday\n    Sunday\n)\n\nfunc (day WeekDay) String() string {\n    return []string{\&quot;Monday\&quot;, \&quot;Tuesday\&quot;, \&quot;Wednesday\&quot;, \&quot;Thursday\&quot;, \&quot;Friday\&quot;, \&quot;Saturday\&quot;, \&quot;Sunday\&quot;}[day-1]\n}\n\nfunc main() {\n    fmt.Println(Monday.String())\n    fmt.Println(Tuesday.String())\n    fmt.Println(Wednesday.String())\n    fmt.Println(Thursday.String())\n    fmt.Println(Friday.String())\n    fmt.Println(Saturday.String())\n    fmt.Println(Sunday.String())\n}\n```&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/go-enum.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/go-enum.png&quot;]]],&quot;digest&quot;:[0,&quot;0090c228a926c697&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;go实现枚举\&quot;&gt;Go实现枚举&lt;/h1&gt;\n&lt;h2 id=\&quot;一前言\&quot;&gt;一、前言&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;在日常开发中我们经常会遇到要使用枚举值的情况，但是Go语言中没有枚举，那么怎么可以在Go语言中使用上枚举呢？我们可以借助一些技巧来实现枚举。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\&quot;二具体实现\&quot;&gt;二、具体实现&lt;/h2&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;type&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; WeekDay&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; int&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;const&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; (&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;    Monday&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; WeekDay&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; =&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 1&lt;/span& lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;String&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;())&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    fmt.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Println&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(Sunday.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;String&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;())&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,1],&quot;slug&quot;:[0,&quot;go实现枚举&quot;],&quot;text&quot;:[0,&quot;Go实现枚举&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;一前言&quot;],&quot;text&quot;:[0,&quot;一、前言&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;二具体实现&quot;],&quot;text&quot;:[0,&quot;二、具体实现&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;三代码示例&quot;],&quot;text&quot;:[0,&quot;三、代码示例&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Go实现枚举&quot;],&quot;description&quot;:[0,&quot;使用Golang实现枚举类型&quot;],&quot;createdAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/go-enum.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;],[0,&quot;枚举&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true],&quot;showAuthor&quot;:[0,false]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;golang-test&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Golang 单元测试指南&quot;],&quot;description&quot;:[0,&quot;深入了解 Go 语言内置的 testing 包，掌握单元测试、基准测试以及表驱动测试的最佳实践。&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-02-04T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-02-04T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/go-test.nrnPHwCh.png&quot;],&quot;width&quot;:[0,840],&quot;height&quot;:[0,240],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,false]}],&quot;body&quot;:[0,&quot;# Golang 单元测试指南\n\n&gt; Go 语言自带了一个轻量级的测试框架 `testing` 和 `go test` 命令，这使得编写和执行测试变得非常简单和高效。本文将介绍如何在 Go 中编写单元测试、表驱动测试以及基准测试。\n\n## 一、基础单元测试\n\n在 Go 中，测试文件通常以 `_test.go` 结尾，并与被测试的代码放在同一个包中。测试函数必须以 `Test` 开头，并接收一个 `*testing.T` 类型的参数。\n\n假设我们有一个简单的加法函数 `Add`：\n\n```go\n// calc.go\npackage calc\n\nfunc Add(a, b int) int {\n    return a + b\n}\n```\n\n对应的测试文件 `calc_test.go` 如下：\n\n```go\n// calc_test.go\npackage calc\n\nimport \&quot;testing\&quot;\n\nfunc TestAdd(t *testing.T) {\n    result := Add(1, 2)\n    expected := 3\n    if result != expected {\n        t.Errorf(\&quot;Add(1, 2) = %d; expected %d\&quot;, result, expected)\n    }\n}\n```\n\n运行测试很简单，只需在终端执行：\n\n```bash\ngo test\n```\n\n## 二、表驱动测试 (Table-Driven Tests)\n\nGo 社区非常推崇“表驱动测试”。这种方式将测试数据（输入和预期输出）定义在一个切片或数组中，然后遍历这个集合执行测试。这样可以轻松添加新的测试用例，且代码结构清晰。\n\n```go\nfunc TestAddTableDriven(t *testing.T) {\n    // 定义测试用例结构\n    tests := []struct {\n        name     string\n        a, b     int\n        expected int\n    }{\n        {\&quot;positive numbers\&quot;, 1, 2, 3},\n        {\&quot;negative numbers\&quot;, -1, -2, -3},\n        {\&quot;mixed numbers\&quot;, -1, 1, 0},\n        {\&quot;zero\&quot;, 0, 0, 0},\n    }\n\n    // 遍历测试用例\n    for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n            result := Add(tt.a, tt.b)\n            if result != tt.expected {\n                t.Errorf(\&quot;Add(%d, %d) = %d; expected %d\&quot;, tt.a, tt.b, result, tt.expected)\n            }\n        })\n    }\n}\n```\n\n使用 `t.Run` 可以创建子测试，这样在运行 `go test -v` 时，可以看到每个子测试的名称和结果。\n\n## 三、TestMain：测试的 Setup 和 Teardown\n\n有时候我们需要在所有测试运行之前进行一些初始化操作（如连接数据库），或在测试结束后清理资源。这时可以使用 `TestMain`。\n\n```go\nfunc TestMain(m *testing.M) {\n    // setup code...\n    println(\&quot;Before all tests\&quot;)\n\n    // 运行测试\n    code := m.Run()\n\n    // teardown code...\n    println(\&quot;After all tests\&quot;)\n\n    // 退出\n    os.Exit(code)\n}\n```\n\n注意：如果有 `TestMain`，测试不会自动运行，必须显式调用 `m.Run()`。\n\n## 四、基准测试 (Benchmark)\n\n除了单元测试，Go 还内置了基准测试框架，用于测试代码的性能。基准测试函数必须以 `Benchmark` 开头，接收 `*testing.B` 参数。\n\n```go\nfunc BenchmarkAdd(b *testing.B) {\n    // b.N 会被框架自动调整，直到运行时间足够长\n    for i := 0; i &lt; b.N; i++ {\n        Add(1, 2)\n    }\n}\n```\n\n运行基准测试：\n\n```bash\ngo test -bench=.\n```\n\n如果想要查看内存分配情况，可以添加 `-benchmem` 参数：\n\n```bash\ngo test -bench=. -benchmem\n```\n\n## 五、 并发测试 (Parallel Testing)\n\n如果你的测试用例之间相互独立，可以使用 `t.Parallel()` 让它们并发运行，从而显著减少测试的总耗时。\n\n```go\nfunc TestParallel(t *testing.T) {\n    t.Parallel() // 标记该测试可以与其他测试并发运行\n    // ... actual test logic ...\n}\n```\n\n## 六、 模糊测试 (Fuzzing)\n\n从 Go 1.18 开始，Go 原生支持模糊测试。Fuzzing 可以自动生成随机输入来查找代码中的边界情况或 crash。\n\n```go\nfunc FuzzAdd(f *testing.F) {\n    // 添加种子语料库 (Seed Corpus)\n    f.Add(1, 2)\n    \n    f.Fuzz(func(t *testing.T, a int, b int) {\n        // 运行被测函数\n        result := Add(a, b)\n        \n        // 验证性质（例如：加法满足交换律）\n        if result != Add(b, a) {\n            t.Errorf(\&quot;Commutative property failed: %d + %d != %d + %d\&quot;, a, b, b, a)\n        }\n    })\n}\n```\n\n运行 Fuzz 测试：`go test -fuzz=Fuzz`\n\n\n## 七、 测试辅助函数 (Test Helpers)\n\n当你提取公共的测试逻辑到辅助函数时，如果测试失败，错误日志通常会指向辅助函数内部，而不是调用它的测试用例。使用 `t.Helper()` 可以标记当前函数为辅助函数，报错时会展示调用者的行号。\n\n```go\nfunc assertEqual(t *testing.T, got, want int) {\n    t.Helper() // 标记为辅助函数\n    if got != want {\n        t.Errorf(\&quot;got %d, want %d\&quot;, got, want)\n    }\n}\n```\n\n## 八、常用测试命令参数\n\n- `go test -v`: 显示详细输出，包括每个测试用例的名称。\n- `go test -cover`: 显示测试覆盖率。\n- `go test -run &lt;RegExp&gt;`: 只运行匹配正则表达式的测试函数。\n- `go test -bench .`: 运行当前包下的所有基准测试。\n- `go test -benchmem .`: 在运行基准测试时显示内存分配统计信息。\n- `go test -race`: 数据竞争检测&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/golang-test.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/go-test.png&quot;]]],&quot;digest&quot;:[0,&quot;cd4b3446ac19b6df&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;golang-单元测试指南\&quot;&gt;Golang 单元测试指南&lt;/h1&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Go 语言自带了一个轻量级的测试框架 &lt;code&gt;testing&lt;/code&gt; 和 &lt;code&gt;go test&lt;/code&gt; 命令，这使得编写和执行测试变得非常简单和高效。本文将介绍如何在 Go 中编写单元测试、表驱动测试以及基准测试。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\&quot;一基础单元测试\&quot;&gt;一、基础单元测试&lt;/h2&gt;\n&lt;p&gt;在 Go 中，测试文件通常以 &lt;code&gt;_test.go&lt;/code&gt; 结尾，并与被测试的代码放在同一个包中。测试函数必须以 &lt;code&gt;Test&lt;/code&gt; 开头，并接收一个 &lt;code&gt;*testing.T&lt;/code&gt; 类型的参数。&lt;/p&gt;\n&lt;p&gt;假设我们有一个简单的加法函数 &lt;code&gt;Add&lt;/code&gt;：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;// calc.go&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;package&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#
