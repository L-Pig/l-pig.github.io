\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#ADBAC7\&quot;&gt;EOF&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 6. 重启 Docker&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; systemctl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; daemon-reload&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; systemctl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; restart&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; docker&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 7. 查看docker配置, 如果出现在daemon.json中配置的内容，即为成功.&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; docker&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; info&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; &lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;Q：为什么要配置使用 systemd 作为 cgroup 驱动？&lt;/p&gt;\n&lt;p&gt;A：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Cgroup 是 Linux 用于限制进程资源（CPU、内存）的机制。&lt;/li&gt;\n&lt;li&gt;Ubuntu 系统默认使用 systemd 来管理所有进程的 Cgroup。&lt;/li&gt;\n&lt;li&gt;Docker 默认使用 cgroupfs 来管理容器 Cgroup。&lt;/li&gt;\n&lt;li&gt;如果两者不一致，系统会有两套资源管理器在打架，导致 K8s 节点不稳定甚至 kubelet 崩溃。必须统一为 systemd。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h5 id=\&quot;安装cri-dockerd\&quot;&gt;安装cri-dockerd&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;为什么需要安装cri-dockerd\n&lt;ul&gt;\n&lt;li&gt;简单来说就是用于docker和k8s 之间做交互的。&lt;/li&gt;\n&lt;li&gt;在k8s 1.24版本之前，k8s 官方维护了一个叫 &lt;code&gt;dockershim&lt;/code&gt; 的组件，但是在1.24版本之后，官方移除了这个组件。&lt;/li&gt;\n&lt;li&gt;所以如果安装1.24之后的k8s 就需要安装 cri-dockerd 用于 k8s 跟 docker之间的交互。&lt;/li&gt;\n&lt;li&gt;它的执行流程是：kubelet (发送指令)-&gt;cri-dockerd (解释为docker认识的指令)-&gt;docker engine (执行指令)&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;安装&lt;/li&gt;\n&lt;/ul&gt;\n&lt;blockquote&gt;\n&lt;p&gt;可以在 &lt;a href=\&quot;https://github.com/Mirantis/cri-dockerd/releases\&quot; rel=\&quot;nofollow noopener noreferrer\&quot; target=\&quot;_blank\&quot;&gt;cri-dockerd 发布日志&lt;/a&gt; 上查看 cri-dockerd 的版本，进行下载&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 获取当前最新的版本号变量（或者手动指定）&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;VER&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;$(&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;curl&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -s&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; https://api.github.com/repos/Mirantis/cri-dockerd/releases/latest&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; |&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; grep&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; tag_name&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; |&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; cut&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;\&quot;&#39;&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -f&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 4&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; |&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; sed&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;s/v//g&#39;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 下载适配 Ubuntu jammy/noble 的 amd64 包&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;wget&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; https://github.com/Mirantis/cri-dockerd/releases/download/v&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;${VER}&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;/cri-dockerd_&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;${VER}&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;.3-0.ubuntu-jammy_amd64.deb&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 安装&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; dpkg&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -i&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; cri-dockerd_&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;${VER}&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;.3-0.ubuntu-jammy_amd64.deb&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 修复潜在的依赖问题（如果有）&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; install&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -f&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;blockquote&gt;\n&lt;p&gt;也可以自己在cri-dockerd的仓库地址中自己下载对应的安装包下来，然后 scp 传到服务器中，执行后面两条指令即可安装。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h5 id=\&quot;配置cri-dockerd\&quot;&gt;配置cri-dockerd&lt;/h5&gt;\n&lt;ul&gt;\n&lt;li&gt;修改 Pause 镜像地址\n&lt;ul&gt;\n&lt;li&gt;找到 &lt;code&gt;cri-docker.service&lt;/code&gt; 的 systemd文件&lt;/li&gt;\n&lt;li&gt;在 &lt;code&gt;ExecStart&lt;/code&gt; 这一行的尾部添加 &lt;code&gt;--network-plugin=cni --pod-infra-container-image=registry.aliyuncs.com/google_containers/pause:3.10.1&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;vim&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /lib/systemd/system/cri-docker.service&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image8.png\&quot; alt=\&quot;cri-docker.service\&quot;&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;配置原因：\n&lt;ul&gt;\n&lt;li&gt;每个 Pod 启动时，都会先启动一个极其微小的容器叫 pause。它的唯一作用是占住网络命名空间（Network Namespace），让同一个 Pod 内的其他容器共享同一个 IP。&lt;/li&gt;\n&lt;li&gt;默认的 pause 镜像在 Google 的服务器上 (k8s.gcr.io)，国内网络通常拉取失败，导致 Pod 一直处于 Pending 或 ContainerCreating 状态。改成阿里云镜像可以解决网络问题。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;安装k8s组件\&quot;&gt;安装k8s组件&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;安装好容器运行时就可以安祖行k8s 组件了: kubelet，kubeadm，kubectl.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\&quot;安装\&quot;&gt;安装&lt;/h3&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 1. 准备 Key 和源&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; install&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -y&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-transport-https&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; ca-certificates&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; curl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; gpg&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;curl&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -fsSL&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; |&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; gpg&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --dearmor&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -o&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/apt/keyrings/kubernetes-apt-keyring.gpg&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;echo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /&#39;&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; |&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; tee&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/apt/sources.list.d/kubernetes.list&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 2. 安装&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; update&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; install&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -y&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubelet&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubectl&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 3. 锁定版本。防止因 apt-get upgrade 自动更新了&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-mark&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; hold&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubelet&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubectl&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;  &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 4. 验证安装结果，如果显示版本则代表按钻过成功&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubectl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; version&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; &lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h3 id=\&quot;初始化-master\&quot;&gt;初始化 Master&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;可以使用命令行初始化，也可以使用配置文件进行初始化。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;使用命令行初始化&lt;/strong&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; init&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;  --node-name=master-node&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;  --image-repository=registry.aliyuncs.com/google_containers&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;  --cri-socket=unix:///var/run/cri-dockerd.sock&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;  --pod-network-cidr=192.168.0.0/16&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;  --kubernetes-version=v1.30.0&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;image-repository&lt;/strong&gt;：使用镜像源，这里配置阿里云的，可加速镜像拉取。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;cri-socket&lt;/strong&gt;：设置 socket 接口文件路径\n&lt;ul&gt;\n&lt;li&gt;默认情况下，kubelet 会自动探测节点上有什么运行时。如果它发现了 Containerd，它就会直接连接 Containerd（因为 Containerd 原生支持 CRI）。此参数让kubelet使用cri-dockerd。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;pod-network-cidr&lt;/strong&gt;：K8s 的 Pod 网络与主机网络是隔离的。我们需要预先划分一个私有网段（例如 192.168.0.0/16）给 Pod 使用。后续安装的网络插件（Calico）会根据这个范围分配 IP。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;blockquote&gt;\n&lt;p&gt;这个命令执行成功后会给两个提示:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;一个提示拷贝配置文件。&lt;/li&gt;\n&lt;li&gt;另一个给出了worker节点加入集群的命令。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;使用配置文件进行初始化&lt;/strong&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;生成默认配置文件模板&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;  # 生成包含 InitConfiguration, ClusterC s=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;  sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; config&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; images&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; pull&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --config&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm-config.yaml&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;如果你看到类似&lt;code&gt;[config/images] Pulled registry.aliyuncs.com/...&lt;/code&gt;的输出且没有报错，说明：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;配置文件格式正确。&lt;/li&gt;\n&lt;li&gt;cri-dockerd 连接正常。&lt;/li&gt;\n&lt;li&gt;阿里云镜像源访问正常。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;使用配置文件开始初始化&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;  sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; init&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --config&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; kubeadm-config.yaml&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;将执行结果中提示执行的指令执行一下。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;mkdir&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -p&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; $HOME&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;/.kube&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; cp&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -i&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/kubernetes/admin.conf&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; $HOME&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;/.kube/config&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; chown&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; $(&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;id&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -u&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;:&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;$(&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;id&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -g&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) $HOME&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;/.kube/config&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;blockquote&gt;\n&lt;p&gt;kubectl 本身只是个 HTTP 客户端。它需要知道 API Server 的地址，以及最重要的——管理员证书（密钥）。这个文件里包含了连接集群所需的所有认证信息。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\&quot;安装网络插件\&quot;&gt;安装网络插件&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;如果下载不下来配置文件可以在可访问到github的机器上下载文件之后，scp到服务器即可。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;kubectl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; create&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -f&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/tigera-operator.yaml&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;kubectl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; create&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -f&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/custom-resources.yaml&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;blockquote&gt;\n&lt;p&gt;K8s 定义了网络接口标准（CNI），但自己不实现具体的网络功能（比如怎么在这个节点给 Pod 分配 IP，怎么把包路由到另一个节点的 Pod）。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;如果不安装 CNI 插件，CoreDNS 等系统组件启动不了，节点状态会一直是 NotReady。Calico 负责打通节点间的隧道（IPIP/BGP），让不同机器上的 Pod 能互相 Ping 通。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\&quot;在worker节点加入集群\&quot;&gt;在worker节点加入集群&lt;/h3&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 执行 初始化master 章节给出的指令，如果是使用 cri-dockerd 作为容器运行时，则需要在命令最后加上 --cri-socket=unix:///var/run/cri-dockerd.sock &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;kubeadm&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; join&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; 192.168.50.180:6443&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --token&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; fhun78.rf36l41t6h5druup&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --discovery-token-ca-cert-hash&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; sha256:5137533109b8160818de26e605d3a141cec853b4c56fab46ea85df99a7501192&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --cri-socket=unix:///var/run/cri-dockerd.sock&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;ul&gt;\n&lt;li&gt;Worker 节点通过 Token 认证加入集群。&lt;/li&gt;\n&lt;li&gt;Worker 节点也需要运行 Pod，所以它也必须知道使用哪个运行时。必须在 join 命令中同样指定 cri-socket，否则 Worker 可能会错误地连接到 containerd 或者报错。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;验证安装\&quot;&gt;验证安装&lt;/h3&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;kubectl&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; nodes&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -o&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; wide&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;如果得到类似下面的输出。则为成功\n&lt;img src=\&quot;/assets/uploads/image9.png\&quot; alt=\&quot;kubeadm-result.service\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;如果你发现 k8s 的访问协议是 https ，不必惊慌(哪怕你是通过ip访问)，因为 k8s 默认使用https安全协议，但它的证书是自签名的，而且是发给集群内部域名的，并不是发给你的本地ip或者域名。当你访问出现不安全的连接时，点击继续访问即可。&lt;/p&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,1],&quot;slug&quot;:[0,&quot;linux-安装k8s-保姆级教程&quot;],&quot;text&quot;:[0,&quot;Linux 安装k8s 保姆级教程&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;什么是k8s&quot;],&quot;text&quot;:[0,&quot;什么是k8s?&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;k8s-的概念&quot;],&quot;text&quot;:[0,&quot;k8s 的概念&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;k8s-是做什么的&quot;],&quot;text&quot;:[0,&quot;k8s 是做什么的&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;核心架构它是如何工作的&quot;],&quot;text&quot;:[0,&quot;核心架构（它是如何工作的？）&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;几个基本概念&quot;],&quot;text&quot;:[0,&quot;几个基本概念&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;准备工作&quot;],&quot;text&quot;:[0,&quot;准备工作&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;服务器准备&quot;],&quot;text&quot;:[0,&quot;服务器准备&quot;]}],[0,{&quot;depth&quot;:[0,3],&quot;slug&quot;:[0,&quot;安装容器运行时&quot;],&quot;text&quot;:[0,&q /uploads/k8s.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Linux&quot;],[0,&quot;Kubernetes&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Kubernetes&quot;],[0,&quot;k8s&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;go-compile-optimized-1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Golang 编译优化-减少体积&quot;],&quot;description&quot;:[0,&quot;Golang 编译优化-减少体积&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-01-20T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-20T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/image.a7r95W2O.png&quot;],&quot;width&quot;:[0,1584],&quot;height&quot;:[0,672],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;# Golang 编译优化：如何极致减小可执行文件体积\n\n&gt; Golang 以其开发效率高、并发性能强著称，但很多 Go 开发者在初次编译项目时都会发现一个问题：**生成的二进制文件（Executable Binary）太大了**。哪怕只是一个简单的 `Hello World`，编译后也可能有 2MB 左右，而包含业务逻辑的 Web 服务动辄几十 MB。   \n&gt; &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;这是因为 Go 的二进制文件是**静态链接**的，它不仅包含了你的代码，还打包了 Go 的 `Runtime`（运行时）、`Garbage Collector`（垃圾回收器）以及所有的依赖库。    \n&gt; &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;虽然存储空间现在很廉价，但在容器化部署（Docker）、Serverless 环境、IoT 设备或网络传输受限的场景下，减小体积仍然至关重要。\n\n本文将介绍几种有效的方法来减少Golang编译的二进制文件的体积。\n\n---\n\n## 准备工作\n\n### 环境：\n\n![image.png](/assets/uploads/image.png)\n\n### 代码\n\n使用一个简单的 Web 服务代码作为测试对象 (`main.go`)：\n\n```go\npackage main\n\nimport (\n\t\&quot;fmt\&quot;\n\t\&quot;net/http\&quot;\n)\n\nfunc main() {\n\thttp.HandleFunc(\&quot;/\&quot;, func(w http.ResponseWriter, r *http.Request) {\n\t\tif _, err := fmt.Fprintf(w, \&quot;Hello, Go Size Optimization!\&quot;); err != nil {\n\t\t\treturn\n\t\t}\n\t})\n\tif err := http.ListenAndServe(\&quot;:8080\&quot;, nil); err != nil {\n\t\tpanic(err)\n\t}\n}\n\n```\n\n### 1. 默认编译\n\n首先进行默认编译，查看初始大小：\n\n```shell\ngo build -o hello .\nls -lh hello\n```\n\n打包文件有 7.4M ，环境不同可能大小有差距\n\n![image1.png](/assets/uploads/image1.png)\n\n---\n\n## 优化手段 1：使用 ldflags 参数 (推荐)\n\n这是最常用、最安全且零成本的优化方式。通过 `go build` 的 `-ldflags` 参数，我们可以告诉链接器（Linker）在构建时去掉一些非必须的信息。\n\n常用参数：\n*   `-s`: 省略符号表（Symbol Table）。\n*   `-w`: 省略 DWARF 调试信息。\n\n**注意**：去掉这些信息后，你将无法使用 `gdb` 或 `dlv` 进行断点调试，panic 时的堆栈信息也可能受到影响（通常文件名和行号还在，但不仅限于此），但在生产环境中通常是可以接受的。\n\n```shell\ngo build -ldflags \&quot;-s -w\&quot; -o app_ldflags main.go\nls -lh app_ldflags\n```\n![image2.png](/assets/uploads/image2.png)\n\n**优化结果：5.1 MB (减少约 31%)**\n\n---\n\n## 优化手段 2：使用 UPX 压缩壳 (神器)\n\n如果 `-ldflags` 还不够，我们可以使用 **UPX (Ultimate Packer for eXecutables)**。它是一个通用的可执行文件压缩器，支持多种格式。它会在程序运行时在内存中快速解压，几乎不影响启动速度，目前只支持压缩`Windows`和`Linux`两个平台的可执行文件。\n\n### 安装 UPX\n*   **MacOS**: `brew install upx`\n*   **Linux**: `apt-get install upx` 或 `yum install upx`\n*   **Windows**: [下载可执行文件](https://github.com/upx/upx)\n\n![image3.png](/assets/uploads/image3.png)\n\n### 使用 UPX\n因为 upx 不支持 MacOS，所以编译一个 Windows 平台的二进制文件，同样先使用 `ldflags` 进行瘦身，然后使用 upx 进行压缩\n\n```shell\nupx -9 app_ldflags.exe                      \n```\n\n![image4.png](/assets/uploads/image4.png)\n\n\n查看大小：\n```bash\nls -alh \n```\n\n![image5.png](/assets/uploads/image5.png)\n\n\n**优化结果：2.2 MB (相比原始大小减少 60%)**\n\n### 关于 UPX 的注意事项\n1. **启动开销**：虽然很小，但解压确实需要 CPU 时间。对于需要毫秒级冷启动的 Serverless 函数，需自行测试权衡。\n2. **跨平台**：某些系统架构或特定的内核版本可能会对加壳程序报警或拦截（误报病毒），在企业级安全严格的环境下需谨慎。\n\n---\n\n## 优化手段 3：移除不必要的依赖\n\n很多时候，体积膨胀是因为引入了庞大的第三方库。\n\n1.  **检查依赖树**：\n    使用 `go mod graph` 或可视化工具查看依赖。\n2.  **按需引入**：\n    例如，你只需要一个简单的 JSON 解析，却引入了一个全功能的 Web 框架；或者只需要生成 UUID，却引入了包含大量加密算法的库。\n3.  **避免使用 `reflect` 和 `fmt` (极端情况)**：\n    `fmt` 包非常庞大，因为它包含了很多反射和格式化逻辑。在极端嵌入式场景下，使用内置的 `print` 或直接操作 IO 可以减小体积，但对普通后端开发不推荐。\n\n---\n\n## 优化手段 4：TinyGo (面向嵌入式/WASM)\n\n如果你是在编写 IoT 设备固件、CLI 小工具或者 WebAssembly (WASM)，可以尝试 **TinyGo**。它是一个基于 LLVM 的 Go 编译器，专门用于生成超小的二进制文件。\n\n```bash\ntinygo build -o app_tiny main.go\nls -lh app_tiny\n... (通常只有几百 KB)\n```\n\n**缺点**：TinyGo 不支持所有的 Go 标准库（虽然支持得越来越好了），且垃圾回收性能不如标准 Go 编译器。不建议用于高并发的大型后端服务。\n\n---\n\n## 进阶：配合 Docker 打造最小镜像\n\n如果你做这些是为了减小 Docker 镜像体积，除了减小二进制文件外，选择基础镜像更为关键。\n\n### 方案 A：Alpine Linux\n```dockerfile\n# 编译阶段\nFROM golang:1.21-alpine AS builder\nWORKDIR /app\nCOPY . .\nRUN go build -ldflags \&quot;-s -w\&quot; -o myapp main.go\n\n# 运行阶段\nFROM alpine:latest\nWORKDIR /root/\nCOPY --from=builder /app/myapp .\nCMD [\&quot;./myapp\&quot;]\n```\n\n### 方案 B：Scratch (空镜像)\n这是 Go 的终极杀招。因为 Go 可以静态编译，我们甚至不需要 Linux 发行版，直接跑在 Kernel 上。\n不过 Docker 上的 `scratch` 镜像已经提示不被支持了，最近一次更新是13年前。\n\n```dockerfile\n# 编译阶段\nFROM golang:1.21-alpine AS builder\nWORKDIR /app\nCOPY . .\n# CGO_ENABLED=0 确保彻底的静态链接，不依赖系统 libc\nRUN CGO_ENABLED=0 GOOS=linux go build -ldflags \&quot;-s -w\&quot; -o myapp main.go\n\n# 运行阶段\nFROM scratch\nCOPY --from=builder /app/myapp /myapp\nCMD [\&quot;/myapp\&quot;]\n```\n使用 Scratch 镜像，你的 Docker 镜像大小几乎等于你的二进制文件大小（可能仅 5MB 左右）。\n\n---\n\n## 总结与建议\n\n| 优化方法 | 减重效果 | 副作用 | 推荐场景 |\n| :--- | :--- | :--- | :--- |\n| **默认编译** | 无 | 包含完整调试信息 | 开发环境、需要 Debug 时 |\n| **ldflags \&quot;-s -w\&quot;** | **中 (约 30%)** | 无法使用 gdb/dlv 调试 | **生产环境标准做法** |\n| **UPX 压缩** | **极高 (约 70%+)** | 极微小的启动延迟，偶见误报 | 对分发体积极度敏感、CLI 工具 |\n| **TinyGo** | 极致 | 功能受限，性能特性不同 | 嵌入式、WASM、简单工具 |\n\n### 最佳实践路线图\n\n1.  **日常生产构建**：始终使用 `go build -ldflags \&quot;-s -w\&quot;`。\n2.  **容器化部署**：配合 `CGO_ENABLED=0` 和 `FROM scratch` 或 `FROM alpine`。\n3.  **CLI 工具分发**：在步骤 1 的基础上，叠加 `UPX` 压缩，方便用户下载。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/go-compile-optimized-1.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/image.png&quot;]]],&quot;digest&quot;:[0,&quot;2df369b468d351f0&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;golang-编译优化如何极致减小可执行文件体积\&quot;&gt;Golang 编译优化：如何极致减小可执行文件体积&lt;/h1&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Golang 以其开发效率高、并发性能强著称，但很多 Go 开发者在初次编译项目时都会发现一个问题：&lt;strong&gt;生成的二进制文件（Executable Binary）太大了&lt;/strong&gt;。哪怕只是一个简单的 &lt;code&gt;Hello World&lt;/code&gt;，编译后也可能有 2MB 左右，而包含业务逻辑的 Web 服务动辄几十 MB。&lt;br&gt;\n        这是因为 Go 的二进制文件是&lt;strong&gt;静态链接&lt;/strong&gt;的，它不仅包含了你的代码，还打包了 Go 的 &lt;code&gt;Runtime&lt;/code&gt;（运行时）、&lt;code&gt;Garbage Collector&lt;/code&gt;（垃圾回收器）以及所有的依赖库。&lt;br&gt;\n        虽然存储空间现在很廉价，但在容器化部署（Docker）、Serverless 环境、IoT 设备或网络传输受限的场景下，减小体积仍然至关重要。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;本文将介绍几种有效的方法来减少Golang编译的二进制文件的体积。&lt;/p&gt;\n&lt;hr&gt;\n&lt;h2 id=\&quot;准备工作\&quot;&gt;准备工作&lt;/h2&gt;\n&lt;h3 id=\&quot;环境\&quot;&gt;环境：&lt;/h3&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image.png\&quot; alt=\&quot;image.png\&quot;&gt;&lt;/p&gt;\n&lt;h3 id=\&quot;代码\&quot;&gt;代码&lt;/h3&gt;\n&lt;p&gt;使用一个简单的 Web 服务代码作为测试对象 (&lt;code&gt;main.go&lt;/code&gt;)：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;package&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; main&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;import&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; (&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\t\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;fmt&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\t\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;net/http&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; main&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;() {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;\thttp.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;HandleFunc&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;/\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;w&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; http&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;ResponseWriter&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;r&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;http&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;Request&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;\t\tif&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; _, err &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;:=&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; fmt.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Fprintf&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(w, &lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;Hello, Go Size Optimization!\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;); err &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;!=&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; nil&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;\t\t\treturn&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;\t\t}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;\t})&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;\tif&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; err &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;:=&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; http.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;ListenAndServe&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;:8080\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;nil&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;); err &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;!=&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; nil&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;\t\tpanic&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(err)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;\t}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h3 id=\&quot;1-默认编译\&quot;&gt;1. 默认编译&lt;/h3&gt;\n&lt;p&gt;首先进行默认编译，查看初始大小：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;go&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; build&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -o&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; hello&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; .&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;ls&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -lh&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; hello&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;打包文件有 7.4M ，环境不同可能大小有差距&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image1.png\&quot; alt=\&quot;image1.png\&quot;&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h2 id=\&quot;优化手段-1使用-ldflags-参数-推荐\&quot;&gt;优化手段 1：使用 ldflags 参数 (推荐)&lt;/h2&gt;\n&lt;p&gt;这是最常用、最安全且零成本的优化方式。通过 &lt;code&gt;go build&lt;/code&gt; 的 &lt;code&gt;-ldflags&lt;/code&gt; 参数，我们可以告诉链接器（Linker）在构建时去掉一些非必须的信息。&lt;/p&gt;\n&lt;p&gt;常用参数：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;-s&lt;/code&gt;: 省略符号表（Symbol Table）。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;-w&lt;/code&gt;: 省略 DWARF 调试信息。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;strong&gt;注意&lt;/strong&gt;：去掉这些信息后，你将无法使用 &lt;code&gt;gdb&lt;/code&gt; 或 &lt;code&gt;dlv&lt;/code&gt; 进行断点调试，panic 时的堆栈信息也可能受到影响（通常文件名和行号还在，但不仅限于此），但在生产环境中通常是可以接受的。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;go&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; build&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -ldflags&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; \&quot;-s -w\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -o&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; app_ldflags&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; main.go&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;ls&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -lh&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; app_ldflags&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image2.png\&quot; alt=\&quot;image2.png\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;优化结果：5.1 MB (减少约 31%)&lt;/strong&gt;&lt;/p&gt;\n&lt;hr&gt;\n&lt;h2 id=\&quot;优化手段-2使用-upx-压缩壳-神器\&quot;&gt;优化手段 2：使用 UPX 压缩壳 (神器)&lt;/h2&gt;\n&lt;p&gt;如果 &lt;code&gt;-ldflags&lt;/code&gt; 还不够，我们可以使用 &lt;strong&gt;UPX (Ultimate Packer for eXecutables)&lt;/strong&gt;。它是一个通用的可执行文件压缩器，支持多种格式。它会在程序运行时在内存中快速解压，几乎不影响启动速度，目前只支持压缩&lt;code&gt;Windows&lt;/code&gt;和&lt;code&gt;Linux&lt;/code&gt;两个平台的可执行文件。&lt;/p&gt;\n&lt;h3 id=\&quot;安装-upx\&quot;&gt;安装 UPX&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;MacOS&lt;/strong&gt;: &lt;code&gt;brew install upx&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Linux&lt;/strong&gt;: &lt;code&gt;apt-get install upx&lt;/code&gt; 或 &lt;code&gt;yum install upx&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Windows&lt;/strong&gt;: &lt;a href=\&quot;https://github.com/upx/upx\&quot; rel=\&quot;nofollow noopener noreferrer\&quot; target=\&quot;_blank\&quot;&gt;下载可执行文件&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image3.png\&quot; alt=\&quot;image3.png\&quot;&gt;&lt;/p&gt;\n&lt;h3 id=\&quot;使用-upx\&quot;&gt;使用 UPX&lt;/h3&gt;\n&lt;p&gt;因为 upx 不支持 MacOS，所以编译一个 Windows 平台的二进制文件，同样先使用 &lt;code&gt;ldflags&lt;/code&gt; 进行瘦身，然后使用 upx 进行压缩&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;upx&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -9&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; app_ldflags.exe&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;                      &lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image4.png\&quot; alt=\&quot;image4.png\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;查看大小：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;ls&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -alh&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; &lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/image5.png\&quot; alt=\&quot;image5.png\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;优化结果：2.2 MB (相比原始大小减少 60%)&lt;/strong&gt;&lt;/p&gt;\n&lt;h3 id=\&quot;关于-upx-的注意事项\&quot;&gt;关于 UPX 的注意事项&lt;/h3&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;启动开销&lt;/strong&gt;：虽然很小，但解压确实需要 CPU 时间。对于需要毫秒级冷启动的 Serverless 函数，需自行测试权衡。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;跨平台&lt;/strong&gt;：某些系统架构或特定的内核版本可能会对加壳程序报警或拦截（误报病毒），在企业级安全严格的环境下需谨慎。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr&gt;\n&lt;h2 id=\&quot;优化手段-3移除不必要的依赖\&quot;&gt;优化手段 3：移除不必要的依赖&lt;/h2&gt;\n&lt;p&gt;很多时候，体积膨胀是因为引入了庞大的第三方库。&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;检查依赖树&lt;/strong&gt;：\n使用 &lt;code&gt;go mod graph&lt;/code&gt; 或可视化工具查看依赖。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;按需引入&lt;/strong&gt;：\n例如，你只需要一个简单的 JSON 解析，却引入了一个全功能的 Web 框架；或者只需要生成 UUID，却引入了包含大量加密算法的库。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;避免使用 &lt;code&gt;reflect&lt;/code&gt; 和 &lt;code&gt;fmt&lt;/code&gt; (极端情况)&lt;/strong&gt;：\n&lt;code&gt;fmt&lt;/code&gt; 包非常庞大，因为它包含了很多反射和格式化逻辑。在极端嵌入式场景下，使用内置的 &lt;code&gt;print&lt;/code&gt; 或直接操作 IO 可以减小体积，但对普通后端开发不推荐。&lt;/li&gt;\n&lt;/ol&gt;\n&lt;hr&gt;\n&lt;h2 id=\&quot;优化手段-4tinygo-面向嵌入式wasm\&quot;&gt;优化手段 4：TinyGo (面向嵌入式/WASM)&lt;/h2&gt;\n&lt;p&gt;如果你是在编写 IoT 设备固件、CLI 小工具或者 WebAssembly (WASM)，可以尝试 &lt;strong&gt;TinyGo&lt;/strong&gt;。它是一个基于 LLVM 的 Go 编译器，专门用于生成超小的二进制文件。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;tinygo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; build&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -o&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; app_tiny&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; main.go&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;ls&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -lh&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; app_tiny&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;...&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; (通常只有几百 &lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;KB&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;strong&gt;缺点&lt;/strong&gt;：TinyGo 不支持所有的 Go 标准库（虽然支持得越来越好了），且垃圾回收性能不如标准 Go 编译器。不建议用于高并发的大型后端服务。&lt;/p&gt;\n&lt;hr&gt;\n&lt;h2 id=\&quot;进阶配合-docker-打造最小镜像\&quot;&gt;进阶：配合 Docker 打造最小镜像&lt;/h2&gt;\n&lt;p&gt;如果你做这些是为了减小 Docker 镜像体积，除了减小二进制文件外，选择基础镜像更为关键。&lt;/p&gt;\n&lt;h3 id=\&quot;方案-aalpine-linux\&quot;&gt;方案 A：Alpine Linux&lt;/h3&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;dockerfile\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 编译阶段&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;FROM&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; golang:1.21-alpine &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;AS&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; builder&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;WORKDIR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; /app&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;COPY&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; . .&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;RUN&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; go build -ldflags &lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;-s -w\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; -o myapp main.go&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 运行阶段&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;FROM&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; alpine:latest&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;WORKDIR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; /root/&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;COPY&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; --from=builder /app/myapp .&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;CMD&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; [&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;./myapp\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;]&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h3 id=\&quot;方案-bscratch-空镜像\&quot;&gt;方案 B：Scratch (空镜像)&lt;/h3&gt;\n&lt;p&gt;这是 Go 的终极杀招。因为 Go 可以静态编译，我们甚至不需要 Linux 发行版，直接跑在 Kernel 上。\n不过 Docker 上的 &lt;code&gt;scratch&lt;/code&gt; 镜像已经提示不被支持了，最近一次更新是13年前。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;dockerfile\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 编译阶段&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;FROM&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; golang:1.21-alpine &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;AS&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; builder&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;WORKDIR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; /app&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;COPY&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; . .&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# CGO_ENABLED=0 确保彻底的静态链接，不依赖系统 libc&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;RUN&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; CGO_ENABLED=0 GOOS=linux go build -ldflags &lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;-s -w\&qu
