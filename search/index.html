gt;\&quot;Add(&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;) = &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;; expected &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, tt.a, tt.b, result, tt.expected)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;            }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;        })&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;使用 &lt;code&gt;t.Run&lt;/code&gt; 可以创建子测试，这样在运行 &lt;code&gt;go test -v&lt;/code&gt; 时，可以看到每个子测试的名称和结果。&lt;/p&gt;\n&lt;h2 id=\&quot;三testmain测试的-setup-和-teardown\&quot;&gt;三、TestMain：测试的 Setup 和 Teardown&lt;/h2&gt;\n&lt;p&gt;有时候我们需要在所有测试运行之前进行一些初始化操作（如连接数据库），或在测试结束后清理资源。这时可以使用 &lt;code&gt;TestMain&lt;/code&gt;。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; TestMain&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;m&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;testing&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;M&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // setup code...&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;    println&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;Before all tests\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // 运行测试&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    code &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;:=&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; m.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Run&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;()&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // teardown code...&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;    println&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;After all tests\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // 退出&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    os.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Exit&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(code)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;注意：如果有 &lt;code&gt;TestMain&lt;/code&gt;，测试不会自动运行，必须显式调用 &lt;code&gt;m.Run()&lt;/code&gt;。&lt;/p&gt;\n&lt;h2 id=\&quot;四基准测试-benchmark\&quot;&gt;四、基准测试 (Benchmark)&lt;/h2&gt;\n&lt;p&gt;除了单元测试，Go 还内置了基准测试框架，用于测试代码的性能。基准测试函数必须以 &lt;code&gt;Benchmark&lt;/code&gt; 开头，接收 &lt;code&gt;*testing.B&lt;/code&gt; 参数。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; BenchmarkAdd&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;b&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;testing&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;B&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // b.N 会被框架自动调整，直到运行时间足够长&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;    for&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; i &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;:=&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 0&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;; i &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;&amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; b.N; i&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;++&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;        Add&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;1&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;2&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;运行基准测试：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;go&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; test&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -bench=.&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;如果想要查看内存分配情况，可以添加 &lt;code&gt;-benchmem&lt;/code&gt; 参数：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;go&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; test&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -bench=.&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -benchmem&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h2 id=\&quot;五-并发测试-parallel-testing\&quot;&gt;五、 并发测试 (Parallel Testing)&lt;/h2&gt;\n&lt;p&gt;如果你的测试用例之间相互独立，可以使用 &lt;code&gt;t.Parallel()&lt;/code&gt; 让它们并发运行，从而显著减少测试的总耗时。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; TestParallel&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;t&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;testing&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;T&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    t.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Parallel&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;() &lt;/span&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;// 标记该测试可以与其他测试并发运行&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // ... actual test logic ...&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h2 id=\&quot;六-模糊测试-fuzzing\&quot;&gt;六、 模糊测试 (Fuzzing)&lt;/h2&gt;\n&lt;p&gt;从 Go 1.18 开始，Go 原生支持模糊测试。Fuzzing 可以自动生成随机输入来查找代码中的边界情况或 crash。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; FuzzAdd&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;f&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;testing&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;F&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;    // 添加种子语料库 (Seed Corpus)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    f.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Add&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;1&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;2&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    f.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Fuzz&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;t&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;testing&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;T&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;a&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; int&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;b&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; int&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;        // 运行被测函数&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;        result &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;:=&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; Add&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(a, b)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;        &lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;        // 验证性质（例如：加法满足交换律）&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;        if&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; result &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;!=&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; Add&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(b, a) {&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;            t.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt;Errorf&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;Commutative property failed: &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; + &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; != &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; + &lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt;%d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, a, b, b, a)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;        }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    })&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;运行 Fuzz 测试：&lt;code&gt;go test -fuzz=Fuzz&lt;/code&gt;&lt;/p&gt;\n&lt;h2 id=\&quot;七-测试辅助函数-test-helpers\&quot;&gt;七、 测试辅助函数 (Test Helpers)&lt;/h2&gt;\n&lt;p&gt;当你提取公共的测试逻辑到辅助函数时，如果测试失败，错误日志通常会指向辅助函数内部，而不是调用它的测试用例。使用 &lt;code&gt;t.Helper()&lt;/code&gt; 可以标记当前函数为辅助函数，报错时会展示调用者的行号。&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;go\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;func&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; assertEqual&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt;t&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;testing&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;T&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, &lt;/span&gt;&lt;span style=\&quot;color:#E36209;--shiki-dark:#F69D50\&quot;&gt &quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    }&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;}&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;h2 id=\&quot;八常用测试命令参数\&quot;&gt;八、常用测试命令参数&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;go test -v&lt;/code&gt;: 显示详细输出，包括每个测试用例的名称。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;go test -cover&lt;/code&gt;: 显示测试覆盖率。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;go test -run &amp;#x3C;RegExp&gt;&lt;/code&gt;: 只运行匹配正则表达式的测试函数。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;go test -bench .&lt;/code&gt;: 运行当前包下的所有基准测试。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;go test -benchmem .&lt;/code&gt;: 在运行基准测试时显示内存分配统计信息。&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;go test -race&lt;/code&gt;: 数据竞争检测&lt;/li&gt;\n&lt;/ul&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,1],&quot;slug&quot;:[0,&quot;golang-单元测试指南&quot;],&quot;text&quot;:[0,&quot;Golang 单元测试指南&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;一基础单元测试&quot;],&quot;text&quot;:[0,&quot;一、基础单元测试&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;二表驱动测试-table-driven-tests&quot;],&quot;text&quot;:[0,&quot;二、表驱动测试 (Table-Driven Tests)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;三testmain测试的-setup-和-teardown&quot;],&quot;text&quot;:[0,&quot;三、TestMain：测试的 Setup 和 Teardown&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;四基准测试-benchmark&quot;],&quot;text&quot;:[0,&quot;四、基准测试 (Benchmark)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;五-并发测试-parallel-testing&quot;],&quot;text&quot;:[0,&quot;五、 并发测试 (Parallel Testing)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;六-模糊测试-fuzzing&quot;],&quot;text&quot;:[0,&quot;六、 模糊测试 (Fuzzing)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;七-测试辅助函数-test-helpers&quot;],&quot;text&quot;:[0,&quot;七、 测试辅助函数 (Test Helpers)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;八常用测试命令参数&quot;],&quot;text&quot;:[0,&quot;八、常用测试命令参数&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Golang 单元测试指南&quot;],&quot;description&quot;:[0,&quot;深入了解 Go 语言内置的 testing 包，掌握单元测试、基准测试以及表驱动测试的最佳实践。&quot;],&quot;createdAt&quot;:[3,&quot;2026-02-04T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-02-04T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/go-test.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,false],&quot;showAuthor&quot;:[0,true]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;tmux&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;tmux 终端&quot;],&quot;description&quot;:[0,&quot;tmux 终端复用&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-01-13T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-13T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/tmux.D0CC9GzY.png&quot;],&quot;width&quot;:[0,800],&quot;height&quot;:[0,600],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Linux&quot;]]],&quot;tags&quot;:[1,[[0,&quot;linux&quot;],[0,&quot;tmux&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;# 什么是 tmux\n\n&gt; `tmux` (terminal multiplexer) 是一个复用终端，可以让用户在一个终端窗口中创建多个会话，每个会话中可以运行多个命令，并且可以同时在多个窗口中进行交互。\n\n# 安装\n\n```shell\n# Ubuntu 或 Debian\nsudo apt-get install tmux\n\n# CentOS 或 Fedora\nsudo yum install tmux\n\n# macOS （brew 指令需要先安装homebrew) \nbrew install tmux\n```\n\n# 使用\n\n## 启动 tmux\n```shell\ntmux\n```\n\n## 会话管理\n\n### 创建会话\n```shell\ntmux new -s &lt;session_name&gt;\n```\n\n### 接入会话\n```shell\n# 接入第一个会话\ntmux a -t 0\n# 接入指定会话\ntmux a -t &lt;session_name&gt;\ntmux attach -t &lt;session_name&gt;\n```\n### 切换会话\n```shell\n# 使用会话编号\ntmux switch -t 0\n# 使用会话名称 \ntmux switch -t &lt;session_name&gt;\n```\n\n### 关闭会话\n```shell\n# 使用会话编号\ntmux kill-session -t 0\n# 使用会话名称\ntmux kill-session -t &lt;session_name&gt;\n```\n\n### 分离会话\n```shell\ntmux detach\n```\n\n### 查看会话列表\n```shell\ntmux ls \ntmux list-session\n```\n\n### 重命名会话\n```shell\n# 将 0 会话重命名为 new_name\ntmux rename-session -t 0 &lt;new_name&gt;\n```\n\n### 快捷键\n  - **Ctrl+b d** ：分离当前会话。\n  - **Ctrl+b s** ：列出所有会话。\n  - **Ctrl+b $** ：重命名当前会话。\n\n\n##  窗格操作\n\n### 划分窗格\n```shell\n# 水平分割，上下两个窗格\ntmux split-window \n# 纵向分割，左右两个窗格\ntmux split-window -h \n\n### 移动光标\n```shell\n# 光标切换到上方窗格\n$ tmux select-pane -U\n\n# 光标切换到下方窗格\n$ tmux select-pane -D\n\n# 光标切换到左边窗格\n$ tmux select-pane -L\n\n# 光标切换到右边窗格\n$ tmux select-pane -R\n\n````\n### 交换窗格位置\n```shell\n# 交换当前窗格和上方窗格\n$ tmux swap-pane -U\n\n# 交换当前窗格和下方窗格\n$ tmux swap-pane -D\n```\n\n### 快捷键\n\n  - **Ctrl+b %** ：划分左右两个窗格。\n  - **Ctrl+b \&quot;** ：划分上下两个窗格。\n  - **Ctrl+b &lt;arrow key&gt;** ：光标切换到其他窗格。&lt;arrow key&gt;是指向要切换到的窗格的方向键，比如切换到下方窗格，就按方向键↓。\n  - **Ctrl+b ;** ：光标切换到上一个窗格。\n  - **Ctrl+b o** ：光标切换到下一个窗格。\n  - **Ctrl+b {** ：当前窗格与上一个窗格交换位置。\n  - **Ctrl+b }** ：当前窗格与下一个窗格交换位置。\n  - **Ctrl+b Ctrl+o** ：所有窗格向前移动一个位置，第一个窗格变成最后一个窗格。\n  - **Ctrl+b Alt+o** ：所有窗格向后移动一个位置，最后一个窗格变成第一个窗格。\n  - **Ctrl+b x** ：关闭当前窗格。\n  - **Ctrl+b !** ：将当前窗格拆分为一个独立窗口。\n  - **Ctrl+b z** ：当前窗格全屏显示，再使用一次会变回原来大小。\n  - **Ctrl+b Ctrl+&lt;arrow key&gt;** ：按箭头方向调整窗格大小。\n  - **Ctrl+b q** ：显示窗格编号。\n\n## 窗口管理\n\n### 创建窗口\n```shell\n# 切换到指定编号的窗口\ntmux select-window -t 0\n\n# 切换到指定名称的窗口\ntmux select-window -t &lt;window-name&gt;\n```\n\n### 重命名窗口\n```shell\n# 命令用于为当前窗口起名（或重命名）\ntmux rename-window &lt;new-name&gt;\n```\n\n### 快捷键\n  - **Ctrl+b c** ：创建一个新窗口，状态栏会显示多个窗口的信息。\n  - **Ctrl+b p** ：切换到上一个窗口（按照状态栏上的顺序）。\n  - **Ctrl+b n** ：切换到下一个窗口。\n  - **Ctrl+b &lt;number&gt;** ：切换到指定编号的窗口，其中的&lt;number&gt;是状态栏上的窗口编号。\n  - **Ctrl+b w** ：从列表中选择窗口。\n  - **Ctrl+b ,** ：窗口重命名。\n\n## 其他指令\n- **tmux list-keys** ：列出所有快捷键，及其对应的 Tmux 命令。\n- **tmux list-commands** ：列出所有 Tmux 命令及其参数。\n- **tmux info** ：列出当前所有 Tmux 会话的信息。\n- **tmux source-file ~/.tmux.conf** ：重新加载当前的 Tmux 配置。\n\n\n&lt;br/&gt;\n&lt;br/&gt;\n&lt;br/&gt;\n\n# 参考\n\n[tmux命令使用](https://www.ruanyifeng.com/blog/2019/10/tmux.html)&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/tmux.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/tmux.png&quot;]]],&quot;digest&quot;:[0,&quot;fb2f8c8c5479970c&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;什么是-tmux\&quot;&gt;什么是 tmux&lt;/h1&gt;\n&lt;blockquote&gt;\n&lt;p&gt;&lt;code&gt;tmux&lt;/code&gt; (terminal multiplexer) 是一个复用终端，可以让用户在一个终端窗口中创建多个会话，每个会话中可以运行多个命令，并且可以同时在多个窗口中进行交互。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h1 id=\&quot;安装\&quot;&gt;安装&lt;/h1&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;shell\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# Ubuntu 或 Debian&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; install&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; tmux&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#76 ot;前缀表达式&quot;],[0,&quot;中缀表达式&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;&gt;  # 什么是中缀表达式、前缀表达式\n&gt;&gt; 在计算机科学和数学逻辑中，**中缀表达式**（Infix Expression）和**前缀表达式**（Prefix Expression）是两种不同的算术或逻辑公式表示方法。&lt;br/&gt;\n&gt;&gt; &amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;它们的核心区别在于**运算符**（如 +, -, *, /）相对于**操作数**（如数字或变量）的**位置**\n\n\n## 一、中缀表达式 (Infix Expression)\n\n1. ### 概念\n    这是我们最熟悉、最符合人类思维习惯的表达方式。\n\n    **定义**：运算符位于两个操作数**中间**。\n    \n    **形式**：`&lt;操作数A&gt; &lt;运算符&gt; &lt;操作数B&gt;`\n    \n    **示例**： \n     - `3 + 4`\n     - `A * (B + C)`\n\n2. ### 优点\n    **依赖优先级**：计算机在处理时，必须知道乘除法优先于加减法。\n \n    **依赖括号**：为了改变运算顺序，必须使用括号。例如 `2 + 3 * 4` 结果是 `14`，而 `(2 + 3) * 4` 结果是 `20`。\n\n3. ### 用途\n    **人类交互**：由于符合直觉，它是所有主流编程语言（C, Java, Python等）和数学教科书中编写公式的标准格式。\n\n    **源代码编写**：程序员编写代码时使用中缀表达式。\n\n## 二、前缀表达式 (Prefix Expression)\n\n1. ###  概念\n    也称为**波兰表达式**（Polish Notation），由波兰逻辑学家 Jan Łukasiewicz 发明。\n\n    **定义**：运算符位于两个操作数**之前**。\n\n    **形式**：`&lt;运算符&gt; &lt;操作数A&gt; &lt;操作数B&gt;`\n    \n    **示例**：\n      - 中缀 `3 + 4` $\\rightarrow$ 前缀 `+ 3 4`\n      - 中缀 `(2 + 3) * 4` $\\rightarrow$ 前缀 `* + 2 3 4`\n\n2. ###  特点\n    **无括号**：这是前缀表达式最大的特点。因为它由运算符的位置自然决定了运算顺序，不需要括号来消除歧义。\n\n    **求值顺序**：\n      - **计算机视角**：通常从右向左扫描。遇到数字压入栈，遇到运算符则弹出栈顶的两个数字进行计算，将结果压入栈。\n      - **树的视角**：前缀表达式对应于**表达式树（Expression Tree）的前序遍历**（Pre-order Traversal）。\n\n3. ###  用途\n   **计算机解析（Parsing）**：相比中缀表达式，前缀表达式更容易被计算机解析，因为它消除了处理运算符优先级和括号匹配的复杂性。\n\n   **函数式编程**：Lisp 语言（及其方言 Scheme, Racket, Clojure）的代码本质上就是前缀表达式。\n     - Lisp 例子：`(+ 1 2)` 表示 `1 + 2`。\n     - **编译器设计**：在构建抽象语法树（AST）时，节点通常是以操作符为根，操作数为子节点，这本质上是一种前缀结构的体现。\n\n\n## 三、Go实现中缀表达式转前缀表达式并计算\n\n```go\n// convert.go\n\npackage main\n\nimport (\n\t\&quot;strconv\&quot;\n\t\&quot;strings\&quot;\n)\n\n// 定义运算符的优先级\nvar precedence = map[string]int{\n\t\&quot;+\&quot;: 1,\n\t\&quot;-\&quot;: 1,\n\t\&quot;*\&quot;: 2,\n\t\&quot;/\&quot;: 2,\n}\n\n// 中缀表达式转前缀表达式\nfunc infixToPrefix(infixExpr string) (string, error) {\n\t// 将中缀表达式转换为逆序的切片\n\treversedTokens := reverseTokens(tokenize(infixExpr))\n\n\t// 栈用于保存运算符\n\tvar operatorStack []string\n\t// 结果字符串\n\tresult := \&quot;\&quot;\n\n\tfor _, token := range reversedTokens {\n\t\tif isOperand(token) {\n\t\t\t// 如果是操作数，直接添加到结果字符串\n\t\t\tresult += token + \&quot; \&quot;\n\t\t} else if token == \&quot;)\&quot; {\n\t\t\t// 如果是右括号，入栈\n\t\t\toperatorStack = append(operatorStack, token)\n\t\t} else if token == \&quot;(\&quot; {\n\t\t\t// 如果是左括号，弹出栈中的运算符并添加到结果字符串，直到遇到右括号\n\t\t\tfor len(operatorStack) &gt; 0 &amp;&amp; operatorStack[len(operatorStack)-1] != \&quot;)\&quot; {\n\t\t\t\tresult += string(operatorStack[len(operatorStack)-1]) + \&quot; \&quot;\n\t\t\t\toperatorStack = operatorStack[:len(operatorStack)-1]\n\t\t\t}\n\t\t\t// 弹出右括号\n\t\t\toperatorStack = operatorStack[:len(operatorStack)-1]\n\t\t} else {\n\t\t\t// 如果是运算符，比较优先级\n\t\t\tfor len(operatorStack) &gt; 0 &amp;&amp; precedence[token] &lt; precedence[operatorStack[len(operatorStack)-1]] {\n\t\t\t\tresult += string(operatorStack[len(operatorStack)-1]) + \&quot; \&quot;\n\t\t\t\toperatorStack = operatorStack[:len(operatorStack)-1]\n\t\t\t}\n\t\t\t// 当前运算符入栈\n\t\t\toperatorStack = append(operatorStack, token)\n\t\t}\n\t}\n\n\t// 将栈中剩余的运算符添加到结果字符串\n\tfor len(operatorStack) &gt; 0 {\n\t\tresult += string(operatorStack[len(operatorStack)-1]) + \&quot; \&quot;\n\t\toperatorStack = operatorStack[:len(operatorStack)-1]\n\t}\n\n\t// 去掉最后的空格并翻转结果字符串\n\tresult = strings.TrimSpace(result)\n\treturn reverseString(result), nil\n}\n\n// 将字符串逆序\nfunc reverseString(s string) string {\n\trunes := []rune(s)\n\tfor i, j := 0, len(runes)-1; i &lt; j; i, j = i+1, j-1 {\n\t\trunes[i], runes[j] = runes[j], runes[i]\n\t}\n\treturn string(runes)\n}\n\n// 将表达式字符串分割成运算符和操作数的切片\nfunc tokenize(expr string) []string {\n\tvar tokens []string\n\ttoken := \&quot;\&quot;\n\n\tfor _, char := range expr {\n\t\tif isOperator(char) || isParenthesis(char) {\n\t\t\tif token != \&quot;\&quot; {\n\t\t\t\ttokens = append(tokens, token)\n\t\t\t\ttoken = \&quot;\&quot;\n\t\t\t}\n\t\t\ttokens = append(tokens, string(char))\n\t\t} else if char == &#39; &#39; {\n\t\t\tif token != \&quot;\&quot; {\n\t\t\t\ttokens = append(tokens, token)\n\t\t\t\ttoken = \&quot;\&quot;\n\t\t\t}\n\t\t} else {\n\t\t\ttoken += string(char)\n\t\t}\n\t}\n\n\tif token != \&quot;\&quot; {\n\t\ttokens = append(tokens, token)\n\t}\n\n\treturn tokens\n}\n\n// 判断是否为运算符\nfunc isOperator(char rune) bool {\n\treturn char == &#39;+&#39; || char == &#39;-&#39; || char == &#39;*&#39; || char == &#39;/&#39;\n}\n\n// 判断是否为括号\nfunc isParenthesis(char rune) bool {\n\treturn char == &#39;(&#39; || char == &#39;)&#39;\n}\n\n// 判断是否为操作数\nfunc isOperand(token string) bool {\n\t_, err := strconv.Atoi(token)\n\treturn err == nil\n}\n\n// 将切片逆序\nfunc reverseTokens(tokens []string) []string {\n\tfor i, j := 0, len(tokens)-1; i &lt; j; i, j = i+1, j-1 {\n\t\ttokens[i], tokens[j] = tokens[j], tokens[i]\n\t}\n\treturn tokens\n}\n\n// 计算前缀表达式\nfunc evalPrefix(prefix string) (int, error) {\n\ttokens := strings.Fields(prefix)\n\tstack := make([]int, 0)\n\n\tfor i := len(tokens) - 1; i &gt;= 0; i-- {\n\t\ttoken := tokens[i]\n\n\t\t// 如果是操作数，入栈\n\t\tif isOperand(token) {\n\t\t\tnum, err := strconv.Atoi(token)\n\t\t\tif err != nil {\n\t\t\t\treturn 0, err\n\t\t\t}\n\t\t\tstack = append(stack, num)\n\t\t} else {\n\t\t\t// 如果是运算符，从栈中弹出相应数量的操作数进行计算\n\t\t\toperand1 := stack[len(stack)-1]\n\t\t\toperand2 := stack[len(stack)-2]\n\t\t\tstack = stack[:len(stack)-2]\n\n\t\t\tswitch token {\n\t\t\tcase \&quot;+\&quot;:\n\t\t\t\tstack = append(stack, operand1+operand2)\n\t\t\tcase \&quot;-\&quot;:\n\t\t\t\tstack = append(stack, operand1-operand2)\n\t\t\tcase \&quot;*\&quot;:\n\t\t\t\tstack = append(stack, operand1*operand2)\n\t\t\tcase \&quot;/\&quot;:\n\t\t\t\tstack = append(stack, operand1/operand2)\n\t\t\t}\n\t\t}\n\t}\n\n\t// 最终栈中剩余的元素即为计算结果\n\tif len(stack) != 1 {\n\t\treturn 0, fmt.Errorf(\&quot;invalid prefix expression\&quot;)\n\t}\n\n\treturn stack[0], nil\n}\n\n```\n\n## 四、运行结果\n\n```go\n// main.go\n\npackage main\n\nimport (\n  \&quot;fmt\&quot;\n)\n\nfunc main() {\n\tinfixExpr := \&quot;1+2*(3+4)+1\&quot;\n\tprefixExpr, err := infixToPrefix(infixExpr)\n\n\tif err != nil {\n\t\tfmt.Println(\&quot;Error:\&quot;, err)\n\t} else {\n\t\tfmt.Println(\&quot;Infix Expression:\&quot;, infixExpr)\n\t\tfmt.Println(\&quot;Prefix Expression:\&quot;, prefixExpr)\n\t}\n\n\tprefix, _ := evalPrefix(prefixExpr)\n\n\tfmt.Println(\&quot;result\&quot;, prefix)\n}\n```&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/prefix_expr.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/expr.png&quot;]]],&quot;digest&quot;:[0,&quot;3461449f70964678&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;blockquote&gt;\n&lt;h1 id=\&quot;什么是中缀表达式前缀表达式\&quot;&gt;什么是中缀表达式、前缀表达式&lt;/h1&gt;\n&lt;blockquote&gt;\n&lt;p&gt;在计算机科学和数学逻辑中，&lt;strong&gt;中缀表达式&lt;/strong&gt;（Infix Expression）和&lt;strong&gt;前缀表达式&lt;/strong&gt;（Prefix Expression）是两种不同的算术或逻辑公式表示方法。&lt;br&gt;\n      它们的核心区别在于&lt;strong&gt;运算符&lt;/strong&gt;（如 +, -, *, /）相对于&lt;strong&gt;操作数&lt;/strong&gt;（如数字或变量）的&lt;strong&gt;位置&lt;/strong&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\&quot;一中缀表达式-infix-expression\&quot;&gt;一、中缀表达式 (Infix Expression)&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;h3 id=\&quot;概念\&quot;&gt;概念&lt;/h3&gt;\n&lt;p&gt;这是我们最熟悉、最符合人类思维习惯的表达方式。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;定义&lt;/strong&gt;：运算符位于两个操作数&lt;strong&gt;中间&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;形式&lt;/strong&gt;：&lt;code&gt;&amp;#x3C;操作数A&gt; &amp;#x3C;运算符&gt; &amp;#x3C;操作数B&gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;示例&lt;/strong&gt;：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;3 + 4&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;A * (B + C)&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;h3 id=\&quot;优点\&quot;&gt;优点&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;依赖优先级&lt;/strong&gt;：计算机在处理时，必须知道乘除法优先于加减法。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;依赖括号&lt;/strong&gt;：为了改变运算顺序，必须使用括号。例如 &lt;code&gt;2 + 3 * 4&lt;/code&gt; 结果是 &lt;code&gt;14&lt;/code&gt;，而 &lt;code&gt;(2 + 3) * 4&lt;/code&gt; 结果是 &lt;code&gt;20&lt;/code&gt;。&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;h3 id=\&quot;用途\&quot;&gt;用途&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;人类交互&lt;/strong&gt;：由于符合直觉，它是所有主流编程语言（C, Java, Python等）和数学教科书中编写公式的标准格式。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;源代码编写&lt;/strong&gt;：程序员编写代码时使用中缀表达式。&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;二前缀表达式-prefix-expression\&quot;&gt;二、前缀表达式 (Prefix Expression)&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;h3 id=\&quot;概念-1\&quot;&gt;概念&lt;/h3&gt;\n&lt;p&gt;也称为&lt;strong&gt;波兰表达式&lt;/strong&gt;（Polish Notation），由波兰逻辑学家 Jan Łukasiewicz 发明。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;定义&lt;/strong&gt;：运算符位于两个操作数&lt;strong&gt;之前&lt;/strong&gt;。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;形式&lt;/strong&gt;：&lt;code&gt;&amp;#x3C;运算符&gt; &amp;#x3C;操作数A&gt; &amp;#x3C;操作数B&gt;&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;示例&lt;/strong&gt;：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;中缀 &lt;code&gt;3 + 4&lt;/code&gt; &lt;span class=\&quot;katex\&quot;&gt;&lt;span class=\&quot;katex-mathml\&quot;&gt;&lt;math xmlns=\&quot;http://www.w3.org/1998/Math/MathML\&quot;&gt;&lt;semantics&gt;&lt;mrow&gt;&lt;mo&gt;→&lt;/mo&gt;&lt;/mrow&gt;&lt;annotation encoding=\&quot;application/x-tex\&quot;&gt;\\rightarrow&lt;/annotation&gt;&lt;/semantics&gt;&lt;/math&gt;&lt;/span&gt;&lt;span class=\&quot;katex-html\&quot; aria-hidden=\&quot;true\&quot;&gt;&lt;span class=\&quot;base\&quot;&gt;&lt;span class=\&quot;strut\&quot; style=\&quot;height:0.3669em;\&quot;&gt;&lt;/span&gt;&lt;span class=\&quot;mrel\&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; 前缀 &lt;code&gt;+ 3 4&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;中缀 &lt;code&gt;(2 + 3) * 4&lt;/code&gt; &lt;span class=\&quot;katex\&quot;&gt;&lt;span class=\&quot;katex-mathml\&quot;&gt;&lt;math xmlns=\&quot;http://www.w3.org/1998/Math/MathML\&quot;&gt;&lt;semantics&gt;&lt;mrow&gt;&lt;mo&gt;→&lt;/mo&gt;&lt;/mrow&gt;&lt;annotation encoding=\&quot;application/x-tex\&quot;&gt;\\rightarrow&lt;/annotation&gt;&lt;/semantics&gt;&lt;/math&gt;&lt;/span&gt;&lt;span class=\&quot;katex-html\&quot; aria-hidden=\&quot;true\&quot;&gt;&lt;span class=\&quot;base\&quot;&gt;&lt;span class=\&quot;strut\&quot; style=\&quot;height:0.3669em;\&quot;&gt;&lt;/span&gt;&lt;span class=\&quot;mrel\&quot;&gt;→&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;&lt;/span&gt; 前缀 &lt;code&gt;* + 2 3 4&lt;/code&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;h3 id=\&quot;特点\&quot;&gt;特点&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;无括号&lt;/strong&gt;：这是前缀表达式最大的特点。因为它由运算符的位置自然决定了运算顺序，不需要括号来消除歧义。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;求值顺序&lt;/strong&gt;：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;计算机视角&lt;/strong&gt;：通常从右向左扫描。遇到数字压入栈，遇到运算符则弹出栈顶的两个数字进行计算，将结果压入栈。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;树的视角&lt;/strong&gt;：前缀表达式对应于&lt;strong&gt;表达式树（Expression Tree）的前序遍历&lt;/strong&gt;（Pre-order Traversal）。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;h3 id=\&quot;用途-1\&quot;&gt;用途&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;计算机解析（Parsing）&lt;/strong&gt;：相比中缀表达式，前缀表达式更容易被计算机解析，因为它消除了处理运算符优先级和括号匹配的复杂性。&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;函数式编程&lt;/strong&gt;：Lisp 语言（及其方言 Scheme, Racket, Clojure）的代码本质上就是前缀表达式。&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Lisp 例子：&lt;code&gt;(+ 1 2)&lt;/code&gt; 表示 &lt;code&gt;1 + 2&lt;/code&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;编译器设计&lt;/strong&gt;：在构建抽象语法树（AST）时，节点通常是以操作符为根，操作数为子节点，这本质上是一种前缀结构的体现。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\&quot;三go实现中缀表达式转前缀表达式并计算\&quot;&gt;三、Go实现中缀表达式转前缀表达式并计算&lt;/h2&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; da t;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;中缀表达式转前缀表达式并计算&quot;],&quot;description&quot;:[0,&quot;使用Golang实现中缀表达式转前缀表达式并计算&quot;],&quot;createdAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-07T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/expr.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Golang&quot;]]],&quot;tags&quot;:[1,[[0,&quot;golang&quot;],[0,&quot;前缀表达式&quot;],[0,&quot;中缀表达式&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;k8s-install&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Kubernetes 安装&quot;],&quot;description&quot;:[0,&quot;Linux 安装Kubernetes&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-02-14T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-02-14T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/k8s.CRLX6Jhf.png&quot;],&quot;width&quot;:[0,1200],&quot;height&quot;:[0,628],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Linux&quot;],[0,&quot;Kubernetes&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Kubernetes&quot;],[0,&quot;k8s&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;# Linux 安装k8s 保姆级教程\n\n&gt; 在安装 k8s 之前我们先了解一下什么是 k8s\n\n\n## 什么是k8s?\n\n### k8s 的概念\n\nK8s 是 `Kubernetes` 的简称。这个缩写取自首字母 “K” 和尾字母 “s”，中间正好有 8 个字母（ubernete），因此得名。\n\nK8s 是一个开源的容器编排（Container Orchestration）平台。它最初由 Google 开发（基于其内部系统 Borg），并于 2014 年开源，目前由云原生计算基金会（CNCF）维护。\n\n如果把容器（如 Docker）比作装满货物的“集装箱”，那么 K8s 就是调度和管理这些集装箱的“大型货轮”或“港口调度员”\n\n### k8s 是做什么的\n\n- **自动化部署和回滚**：K8s 会自动帮你部署。如果更新版本出错了，它也能自动回滚。\n- **服务发现与负载均衡**：K8s 可以为一组容器提供统一的访问入口（IP 或域名），并自动平衡流量，确保不会因为某个容器压力过大而崩溃。\n- **自我修复（Self-healing）**：如果某个容器挂了，K8s 会立即发现并重启一个新的；如果某个服务器（节点）挂了，它会把上面的容器迁移到健康的服务器上。\n- **弹性伸缩（Scaling）**：当流量高峰来临时，K8s 可以在几秒钟内自动增加容器数量；流量减少时再自动缩减，节省成本。\n- **存储编排**：无论你的数据存在本地、云端还是分布式系统中，K8s 都能自动挂载这些存储系统。\n\n### 核心架构（它是如何工作的？）\n\n- **控制平面（Control Plane / Master 节点）**：集群的大脑，负责做决策（比如调度哪些容器到哪个机器运行）。\n  - **API Server**：整个系统的入口，所有指令都通过它下发。\n  - **etcd**：保存集群所有配置和状态的数据库。\n  - **Scheduler（调度器）**：决定把容器放到哪台机器上。\n  - **Controller Manager**：负责执行任务，比如确保副本数量始终正确。\n- **工作节点（Worker Nodes / Node 节点）**：真正干活的机器，运行容器化的应用。\n  - **kubelet**：节点上的管家，负责与 Master 通信并执行任务。\n  - **kube-proxy**：负责网络通信。\n\n### 几个基本概念\n\n- **Pod**：K8s 的最小调度单位。一个 Pod 里面可以包含一个或多个容器（通常是一个）。你可以把它理解为装着容器的吊篮。\n- **Deployment**：定义应用该如何运行的策略（比如运行几个副本、用哪个镜像）。\n- **Service**：定义如何访问一组 Pod（解决 Pod 频繁变动导致 IP 改变的问题）。\n- **Namespace**：用于虚拟隔离。比如把“开发环境”和“生产环境”在逻辑上分开。\n\n## 准备工作\n\n### 服务器准备\n\n准备至少三台服务器，或者虚拟机。如果没有，则可以看 `MiniKube` 的教程 把 master 和 worker 都部署到一起。\n我这里准备了3台ubuntu 24的虚拟机。使用的 windows 的 Hyper-V 安装的。\n\n|       ip          |      作用      |\n|-------------------|----------------|\n|  192.168.50.180   |     Master     |\n|  192.168.50.181   |     Worker     | \n|  192.168.50.183   |     Worker     |\n\n- **每台服务器至少2核CPU和2G内存(内存是k8s 强制要求)，且互相之间网络互通，也需要能连外网，因为需要下载k8s的安装文件以及相关的程序的包(比如Docker等)，且拥有sudu权限。**\n- 本地测试，我这边是关闭防火墙的,如果是生产环境，需要放行特定的端口，视具体环境而定。\n  - 关闭防火墙的命令是：`sudo ufw disable`。\n- 需要关闭Swap交换内存。\n  - 关闭交换分区的命令是：\n    ```bash \n      # 临时关闭，重启失效\n      sudo swapoff -a\n      # 永久关闭（注释配置文件：/etc/fatab 中 /swap/开头的那一行配置即可）\n      sudo sed -i &#39;/swap/ s/^\\(.*\\)$/#\\1/g&#39; /etc/fstab\n    ``` \n    ![swapoff.png](/assets/uploads/image6.png)\n  - 关闭swap分区的原因是：Kubernetes的调度器(也就是Scheduler) 在分配Pod到节点时，是根据 **内存绝对值(也就是具体的内存,如 2G,4G 等，不是内存使用占比)** 计算的。因此，当内存不足的时候：\n    - 如果没有关闭swap分区。系统就会使用交换分区的内存，导致性能下降，甚至进程卡住，但是程序不会崩溃。\n    - k8s希望当内存不足的时候是肢解杀掉Pod，并重新调度Pod，而不是让整个节点(worker)变慢或卡住。\n  - 配置内核模块和网络参数\n    ```bash # 加载模块\n        cat &lt;&lt;EOF | sudo tee /etc/modules-load.d/k8s.conf\n        overlay\n        br_netfilter\n        EOF\n\n        sudo modprobe overlay\n        sudo modprobe br_netfilter\n\n        # 配置 sysctl 参数\n        cat &lt;&lt;EOF | sudo tee /etc/sysctl.d/k8s.conf\n        net.bridge.bridge-nf-call-iptables  = 1\n        net.bridge.bridge-nf-call-ip6tables = 1\n        net.ipv4.ip_forward                 = 1\n        EOF\n\n        # 应用参数\n        sudo sysctl --system \n    ```\n      ![conf](/assets/uploads/image7.png)\n    - 原因: 默认情况下，Linux 仅仅作为一台主机，不会转发不属于自己的流量。但在 K8s 中，每个 Node 实际上是一个路由器，它需要把发往 Pod IP 的流量转发到对应的容器网络接口（veth pair）。如果不开启，Pod 只能访问本机，无法访问外网或其他节点。\n  做完了这些之后，就可以准备开始安装k8s以及相关的组件了。\n\n### 安装容器运行时\n&gt; 所有节点都需要安装(可选Docker或者Containerd)。\n\n&gt; Kubernetes 从 1.24版本开始，移除了 dockershim 。如果使用 docker 作为容器运行时，可往下翻。\n\n#### 使用Containerd作为容器运行时\n##### 安装Containerd (有可能在国内拉不下来镜像)\n\n```bash \n# 安装 Docker 官方 GPG Key 和 Repo (为了获取最新版 containerd)\nsudo apt-get update\nsudo apt-get install -y ca-certificates curl\nsudo install -m 0755 -d /etc/apt/keyrings\nsudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc\nsudo chmod a+r /etc/apt/keyrings/docker.asc\n\necho \\\n  \&quot;deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \\\n  $(. /etc/os-release &amp;&amp; echo \&quot;$VERSION_CODENAME\&quot;) stable\&quot; | \\\n  sudo tee /etc/apt/sources.list.d/docker.list &gt; /dev/null\n\nsudo apt-get update\nsudo apt-get install -y containerd.io\n\n```\n##### 配置Containerd\n&gt; 必须配置 SystemdCgroup，否则 kubelet 会启动失败。\n```bash\n # 生成默认配置\nsudo mkdir -p /etc/containerd\nsudo containerd config default | sudo tee /etc/containerd/config.toml\n\n# 修改配置以启用 SystemdCgroup\nsudo sed -i &#39;s/SystemdCgroup = false/SystemdCgroup = true/g&#39; /etc/containerd/config.toml\n\n# 重启 containerd\nsudo systemctl restart containerd\n```\n\n#### 使用Docker作为容器运行时\n\n##### 安装Docker\n\n```bash\n# 1. 更新并安装依赖\nsudo apt-get update\nsudo apt-get install -y ca-certificates curl gnupg\n\n# 2. 添加 Docker 官方 GPG Key\nsudo install -m 0755 -d /etc/apt/keyrings\ncurl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg\nsudo chmod a+r /etc/apt/keyrings/docker.gpg\n\n# 3. 添加 Docker 仓库 (Ubuntu 24.04 代号为 noble)\necho \\\n  \&quot;deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \\\n  $(. /etc/os-release &amp;&amp; echo \&quot;$VERSION_CODENAME\&quot;) stable\&quot; | \\\n  sudo tee /etc/apt/sources.list.d/docker.list &gt; /dev/null\n\n# 4. 安装 Docker\nsudo apt-get update\nsudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin\n\n# 5. 配置 Docker 使用 systemd 作为 cgroup 驱动，同时添加docker国内镜像源\ncat &lt;&lt;EOF | sudo tee /etc/docker/daemon.json\n{ \n  \&quot;registry-mirrors\&quot;: [\n    \&quot;https://docker.1ms.run\&quot;,\n    \&quot;https://doublezonline.cloud\&quot;,\n    \&quot;https://dislabaiot.xyz\&quot;,\n    \&quot;https://docker.fxxk.dedyn.io\&quot;,\n    \&quot;https://dockerpull.org\&quot;,\n    \&quot;https://docker.unsee.tech\&quot;,\n    \&quot;https://hub.rat.dev\&quot;,\n    \&quot;https://docker.1panel.live\&quot;,\n    \&quot;https://docker.nastool.de\&quot;,\n    \&quot;https://docker.zhai.cm\&quot;,\n    \&quot;https://docker.5z5f.com\&quot;,\n    \&quot;https://a.ussh.net\&quot;,\n    \&quot;https://docker.udayun.com\&quot;,\n    \&quot;https://hub.geekery.cn\&quot;,\n    \&quot;https://registry.aliyuncs.com\&quot;\n  ],\n  \&quot;exec-opts\&quot;: [\&quot;native.cgroupdriver=systemd\&quot;],\n  \&quot;log-driver\&quot;: \&quot;json-file\&quot;,\n  \&quot;log-opts\&quot;: {\n    \&quot;max-size\&quot;: \&quot;100m\&quot;\n  },\n  \&quot;storage-driver\&quot;: \&quot;overlay2\&quot;\n}\nEOF\n\n# 6. 重启 Docker\nsudo systemctl daemon-reload\nsudo systemctl restart docker\n\n# 7. 查看docker配置, 如果出现在daemon.json中配置的内容，即为成功.\nsudo docker info \n```\n\nQ：为什么要配置使用 systemd 作为 cgroup 驱动？  \n\nA：\n  - Cgroup 是 Linux 用于限制进程资源（CPU、内存）的机制。\n  - Ubuntu 系统默认使用 systemd 来管理所有进程的 Cgroup。\n  - Docker 默认使用 cgroupfs 来管理容器 Cgroup。\n  - 如果两者不一致，系统会有两套资源管理器在打架，导致 K8s 节点不稳定甚至 kubelet 崩溃。必须统一为 systemd。\n\n##### 安装cri-dockerd\n- 为什么需要安装cri-dockerd\n  - 简单来说就是用于docker和k8s 之间做交互的。\n  - 在k8s 1.24版本之前，k8s 官方维护了一个叫 `dockershim` 的组件，但是在1.24版本之后，官方移除了这个组件。\n  - 所以如果安装1.24之后的k8s 就需要安装 cri-dockerd 用于 k8s 跟 docker之间的交互。\n  - 它的执行流程是：kubelet (发送指令)-&gt;cri-dockerd (解释为docker认识的指令)-&gt;docker engine (执行指令)\n- 安装\n&gt; 可以在 [cri-dockerd 发布日志](https://github.com/Mirantis/cri-dockerd/releases) 上查看 cri-dockerd 的版本，进行下载\n```bash\n# 获取当前最新的版本号变量（或者手动指定）\nVER=$(curl -s https://api.github.com/repos/Mirantis/cri-dockerd/releases/latest | grep tag_name | cut -d &#39;\&quot;&#39; -f 4 | sed &#39;s/v//g&#39;)\n\n# 下载适配 Ubuntu jammy/noble 的 amd64 包\nwget https://github.com/Mirantis/cri-dockerd/releases/download/v${VER}/cri-dockerd_${VER}.3-0.ubuntu-jammy_amd64.deb\n\n# 安装\nsudo dpkg -i cri-dockerd_${VER}.3-0.ubuntu-jammy_amd64.deb\n\n# 修复潜在的依赖问题（如果有）\nsudo apt-get install -f\n```\n&gt; 也可以自己在cri-dockerd的仓库地址中自己下载对应的安装包下来，然后 scp 传到服务器中，执行后面两条指令即可安装。\n\n##### 配置cri-dockerd\n- 修改 Pause 镜像地址\n  - 找到 `cri-docker.service` 的 systemd文件\n  - 在 `ExecStart` 这一行的尾部添加 `--network-plugin=cni --pod-infra-container-image=registry.aliyuncs.com/google_containers/pause:3.10.1`\n```bash\nvim /lib/systemd/system/cri-docker.service\n```\n![cri-docker.service](/assets/uploads/image8.png)\n- 配置原因：\n  - 每个 Pod 启动时，都会先启动一个极其微小的容器叫 pause。它的唯一作用是占住网络命名空间（Network Namespace），让同一个 Pod 内的其他容器共享同一个 IP。\n  - 默认的 pause 镜像在 Google 的服务器上 (k8s.gcr.io)，国内网络通常拉取失败，导致 Pod 一直处于 Pending 或 ContainerCreating 状态。改成阿里云镜像可以解决网络问题。\n  \n## 安装k8s组件\n&gt; 安装好容器运行时就可以安祖行k8s 组件了: kubelet，kubeadm，kubectl.\n\n### 安装 \n```bash\n# 1. 准备 Key 和源\nsudo apt-get install -y apt-transport-https ca-certificates curl gpg\n\ncurl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg\n\necho &#39;deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /&#39; | sudo tee /etc/apt/sources.list.d/kubernetes.list\n\n# 2. 安装\nsudo apt-get update\nsudo apt-get install -y kubelet kubeadm kubectl\n# 3. 锁定版本。防止因 apt-get upgrade 自动更新了\nsudo apt-mark hold kubelet kubeadm kubectl  \n# 4. 验证安装结果，如果显示版本则代表按钻过成功\nsudo kubectl version \n```\n\n\n### 初始化 Master\n\n&gt; 可以使用命令行初始化，也可以使用配置文件进行初始化。    \n\n- **使用命令行初始化**\n```bash\nsudo kubeadm init \\\n  --node-name=master-node \\\n  --image-repository=registry.aliyuncs.com/google_containers \\\n  --cri-socket=unix:///var/run/cri-dockerd.sock \\\n  --pod-network-cidr=192.168.0.0/16 \\\n  --kubernetes-version=v1.30.0\n```\n\n  - **image-repository**：使用镜像源，这里配置阿里云的，可加速镜像拉取。\n  - **cri-socket**：设置 socket 接口文件路径\n    - 默认情况下，kubelet 会自动探测节点上有什么运行时。如果它发现了 Containerd，它就会直接连接 Containerd（因为 Containerd 原生支持 CRI）。此参数让kubelet使用cri-dockerd。\n  - **pod-network-cidr**：K8s 的 Pod 网络与主机网络是隔离的。我们需要预先划分一个私有网段（例如 192.168.0.0/16）给 Pod 使用。后续安装的网络插件（Calico）会根据这个范围分配 IP。\n&gt; 这个命令执行成功后会给两个提示:\n&gt; - 一个提示拷贝配置文件。\n&gt; - 另一个给出了worker节点加入集群的命令。 \n\n- **使用配置文件进行初始化**\n  - 生成默认配置文件模板\n    ```bash \n      # 生成包含 InitConfiguration, ClusterConfiguration 和 KubeletConfiguration 的完整模板\n      kubeadm config print init-defaults --component-configs KubeletConfiguration &gt; kubeadm-config.yaml\n    ```\n  - 修改配置文件\n    ```yaml\n      apiVersion: kubeadm.k8s.io/v1beta4  # v1.35 通常使用 v1beta4 或 v1beta3\n      kind: InitConfiguration\n      localAPIEndpoint:\n        advertiseAddress: 192.168.50.180   # 修改为你 Master 节点的实际 IP\n        bindPort: 6443\n      nodeRegistration:\n        criSocket: unix:///var/run/cri-dockerd.sock # 必须指向 cri-dockerd 的套接字\n        name: master-node                 # 你的主机名，或者保持默认\n        taints: null                      # 可选：如果你想让 Master 也能跑业务 Pod，设为 null\n      ---\n      apiVersion: kubeadm.k8s.io/v1beta4\n      kind: ClusterConfiguration\n      kubernetesVersion: v1.35.0          # 指定版本\n      imageRepository: registry.aliyuncs.com/google_containers # 国内使用阿里云镜像\n      networking:\n        dnsDomain: cluster.local\n        podSubnet: 192.168.0.0/16         # Calico 默认网段，必须配置\n        serviceSubnet: 10.96.0.0/12\n      scheduler: {}\n      ---\n      apiVersion: kubelet.config.k8s.io/v1beta1  # 和上面的两个配置的值不一样。如果修改不正确，在初始化 master 的时候会报错。\n      kind: KubeletConfiguration\n      cgroupDriver: systemd               # 设置cgroup，Ubuntu 24 + Docker 必须显式指定 systemd\n      failSwapOn: true                    # 默认 true，如果没关 swap 这里设为 false 但是不推荐不关闭swap\n    ```\n\n  - 验证配置文件\n    ```bash\n      # 预拉取镜像,\n      sudo kubeadm config images pull --config kubeadm-config.yaml\n    ```\n\n    如果你看到类似` [config/images] Pulled registry.aliyuncs.com/... `的输出且没有报错，说明：\n      - 配置文件格式正确。\n      - cri-dockerd 连接正常。\n      - 阿里云镜像源访问正常。\n\n  - 使用配置文件开始初始化\n    ```bash\n      sudo kubeadm init --config kubeadm-config.yaml\n    ```\n\n将执行结果中提示执行的指令执行一下。\n```bash\nmkdir -p $HOME/.kube\nsudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config\nsudo chown $(id -u):$(id -g) $HOME/.kube/config\n```\n&gt; kubectl 本身只是个 HTTP 客户端。它需要知道 API Server 的地址，以及最重要的——管理员证书（密钥）。这个文件里包含了连接集群所需的所有认证信息。\n\n### 安装网络插件 \n&gt; 如果下载不下来配置文件可以在可访问到github的机器上下载文件之后，scp到服务器即可。\n\n```bash\nkubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/tigera-operator.yaml\nkubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.3/manifests/custom-resources.yaml\n```\n&gt; K8s 定义了网络接口标准（CNI），但自己不实现具体的网络功能（比如怎么在这个节点给 Pod 分配 IP，怎么把包路由到另一个节点的 Pod）。\n\n&gt; 如果不安装 CNI 插件，CoreDNS 等系统组件启动不了，节点状态会一直是 NotReady。Calico 负责打通节点间的隧道（IPIP/BGP），让不同机器上的 Pod 能互相 Ping 通。\n\n### 在worker节点加入集群\n```bash\n# 执行 初始化master 章节给出的指令，如果是使用 cri-dockerd 作为容器运行时，则需要在命令最后加上 --cri-socket=unix:///var/run/cri-dockerd.sock \nkubeadm join 192.168.50.180:6443 --token fhun78.rf36l41t6h5druup --discovery-token-ca-cert-hash sha256:5137533109b8160818de26e605d3a141cec853b4c56fab46ea85df99a7501192 --cri-socket=unix:///var/run/cri-dockerd.sock\n```\n- Worker 节点通过 Token 认证加入集群。\n- Worker 节点也需要运行 Pod，所以它也必须知道使用哪个运行时。必须在 join 命令中同样指定 cri-socket，否则 Worker 可能会错误地连接到 containerd 或者报错。\n\n### 验证安装\n```bash \nkubectl get nodes -o wide\n```\n\n如果得到类似下面的输出。则为成功\n![kubeadm-result.service](/assets/uploads/image9.png)\n\n\n如果你发现 k8s 的访问协议是 https ，不必惊慌(哪怕你是通过ip访问)，因为 k8s 默认使用https安全协议，但它的证书是自签名的，而且是发给集群内部域名的，并不是发给你的本地ip或者域名。当你访问出现不安全的连接时，点击继续访问即可。&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/k8s-install.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/k8s.png&quot;]]],&quot;digest&quot;:[0,&quot;e4c83532251b3e7b&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;linux-安装k8s-保姆级教程\&quot;&gt;Linux 安装k8s 保姆级教程&lt;/h1&gt;\n&lt;blockquote&gt;\n&lt;p&gt;在安装 k8s 之前我们先了解一下什么是 k8s&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\&quot;什么是k8s\&quot;&gt;什么是k8s?&lt;/h2&gt;\n&lt;h3 id=\&quot;k8s-的概念\&quot;&gt;k8s 的概念&lt;/h3&gt;\n&lt;p&gt;K8s 是 &lt;code&gt;Kubernetes&lt;/code&gt; 的简称。这个缩写取自首字母 “K” 和尾字母 “s”，中间正好有 8 个字母（ubernete），因此得名。&lt;/p&gt;\n&lt;p&gt;K8s 是一个开源的容器编排（Container Orchestration）平台。它最初由 Google 开发（基于其内部系统 Borg），并于 2014 年开源，目前由云原生计算基金会（CNCF）维护。&lt;/p&gt;\n&lt;p&gt;如果把容器（如 Docker）比作装满货物的“集装箱”，那么 K8s 就是调度和管理这些集装箱的“大型货轮”或“港口调度员”&lt;/p&gt;\n&lt;h3 id=\&quot;k8s-是做什么的\&quot;&gt;k8s 是做什么的&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;自动化部署和回滚&lt;/strong&gt;：K8s 会自动帮你部署。如果更新版本出错了，它也能自动回滚。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;服务发现与负载均衡&lt;/strong&gt;：K8s 可以为一组容器提供统一的访问入口（IP 或域名），并自动平衡流量，确保不会因为某个容器压力过大而崩溃。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;自我修复（Self-healing）&lt;/strong&gt;：如果某个容器挂了，K8s 会立即发现并重启一个新的；如果某个服务器（节点）挂了，它会把上面的容器迁移到健康的服务器上。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;弹性伸缩（Scaling）&lt;/strong&gt;：当流量高峰来临时，K8s 可以在几秒钟内自动增加容器数量；流量减少时再自动缩减，节省成本。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;存储编排&lt;/strong&gt;：无论你的数据存在本地、云端还是分布式系统中，K8s 都能自动挂载这些存储系统。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;核心架构它是如何工作的\&quot;&gt;核心架构（它是如何工作的？）&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;控制平面（Control Plane / Master 节点）&lt;/strong&gt;：集群的大脑，负责做决策（比如调度哪些容器到哪个机器运行）。\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;API Server&lt;/strong&gt;：整个系统的入口，所有指令都通过它下发。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;etcd&lt;/strong&gt;：保存集群所有配置和状态的数据库。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Scheduler（调度器）&lt;/strong&gt;：决定把容器放到哪台机器上。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Controller Manager&lt;/strong&gt;：负责执行任务，比如确保副本数量始终正确。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;工作节点（Worker Nodes / Node 节点）&lt;/strong&gt;：真正干活的机器，运行容器化的应用。\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;kubelet&lt;/strong&gt;：节点上的管家，负责与 Master 通信并执行任务。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;kube-proxy&lt;/strong&gt;：负责网络通信。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;几个基本概念\&quot;&gt;几个基本概念&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Pod&lt;/strong&gt;：K8s 的最小调度单位。一个 Pod 里面可以包含一个或多个容器（通常是一个）。你可以把它理解为装着容器的吊篮。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Deployment&lt;/strong&gt;：定义应用该如何运行的策略（比如运行几个副本、用哪个镜像）。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Service&lt;/strong&gt;：定义如何访问一组 Pod（解决 Pod 频繁变动导致 IP 改变的问题）。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Namespace&lt;/strong&gt;：用于虚拟隔离。比如把“开发环境”和“生产环境”在逻辑上分开。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;准备工作\&quot;&gt;准备工作&lt;/h2&gt;\n&lt;h3 id=\&quot;服务器准备\&quot;&gt;服务器准备&lt;/h3&gt;\n&lt;p&gt;准备至少三台服务器，或者虚拟机。如果没有，则可以看 &lt;code&gt;MiniKube&lt;/code&gt; 的教程 把 master 和 worker 都部署到一起。\n我这里准备了3台ubuntu 24的虚拟机。使用的 windows 的 Hyper-V 安装的。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;ip&lt;/th&gt;&lt;th&gt;作用&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;192.168.50.180&lt;/td&gt;&lt;td&gt;Master&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;192.168.50.181&lt;/td&gt;&lt;td&gt;Worker&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;192.168.50.183&lt;/td&gt;&lt;td&gt;Worker&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;每台服务器至少2核CPU和2G内存(内存是k8s 强制要求)，且互相之间网络互通，也需要能连外网，因为需要下载k8s的安装文件以及相关的程序的包(比如Docker等)，且拥有sudu权限。&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;本地测试，我这边是关闭防火墙的,如果是生产环境，需要放行特定的端口，视具体环境而定。\n&lt;ul&gt;\n&lt;li&gt;关闭防火墙的命令是：&lt;code&gt;sudo ufw disable&lt;/code&gt;。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;需要关闭Swap交换内存。\n&lt;ul&gt;\n&lt;li&gt;关闭交换分区的命令是：\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;  # 临时关闭，重启失效&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;  sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; swapoff&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -a&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;  # 永久关闭（注释配置文件：/etc/fatab 中 /swap/开头的那一行配置即可）&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;  sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; sed&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -i&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; &#39;/swap/ s/^\\(.*\\)$/#\\1/g&#39;&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/fstab&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;img src=\&quot;/assets/uploads/image6.png\&quot; alt=\&quot;swapoff.png\&quot;&gt;&lt;/li&gt;\n&lt;li&gt;关闭swap分区的原因是：Kubernetes的调度器(也就是Scheduler) 在分配Pod到节点时，是根据 &lt;strong&gt;内存绝对值(也就是具体的内存,如 2G,4G 等，不是内存使用占比)&lt;/strong&gt; 计算的。因此，当内存不足的时候：\n&lt;ul&gt;\n&lt;li&gt;如果没有关闭swap分区。系统就会使用交换分区的内存，导致性能下降，甚至进程卡住，但是程序不会崩溃。&lt;/li&gt;\n&lt;li&gt;k8s希望当内存不足的时候是肢解杀掉Pod，并重新调度Pod，而不是让整个节点(worker)变慢或卡住。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;配置内核模块和网络参数\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;    cat&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; &amp;#x3C;&amp;#x3C;&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#ADBAC7\&quot;&gt;EOF&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; |&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt; sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; tee&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/modules-load.d/k8s.conf&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    overlay&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    br_netfilter&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    EOF&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    sudo modprobe overlay&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    sudo modprobe br_netfilter&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    # 配置 sysctl 参数&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    cat &amp;#x3C;&amp;#x3C;EOF | sudo tee /etc/sysctl.d/k8s.conf&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    net.bridge.bridge-nf-call-iptables  = 1&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    net.bridge.bridge-nf-call-ip6tables = 1&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    net.ipv4.ip_forward                 = 1&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    EOF&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    # 应用参数&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;    sudo sysctl --system &lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;img src=\&quot;/assets/uploads/image7.png\&quot; alt=\&quot;conf\&quot;&gt;\n&lt;ul&gt;\n&lt;li&gt;原因: 默认情况下，Linux 仅仅作为一台主机，不会转发不属于自己的流量。但在 K8s 中，每个 Node 实际上是一个路由器，它需要把发往 Pod IP 的流量转发到对应的容器网络接口（veth pair）。如果不开启，Pod 只能访问本机，无法访问外网或其他节点。\n做完了这些之后，就可以准备开始安装k8s以及相关的组件了。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\&quot;安装容器运行时\&quot;&gt;安装容器运行时&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;所有节点都需要安装(可选Docker或者Containerd)。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Kubernetes 从 1.24版本开始，移除了 dockershim 。如果使用 docker 作为容器运行时，可往下翻。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\&quot;使用containerd作为容器运行时\&quot;&gt;使用Containerd作为容器运行时&lt;/h4&gt;\n&lt;h5 id=\&quot;安装containerd-有可能在国内拉不下来镜像\&quot;&gt;安装Containerd (有可能在国内拉不下来镜像)&lt;/h5&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;bash\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6A737D;--shiki-dark:#768390\&quot;&gt;# 安装 Docker 官方 GPG Key 和 Repo (为了获取最新版 containerd)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; update&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; apt-get&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; install&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -y&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; ca-certificates&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; curl&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; install&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -m&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 0755&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -d&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/apt/keyrings&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; curl&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -fsSL&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; https://download.docker.com/linux/ubuntu/gpg&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; -o&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/apt/keyrings/docker.asc&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;sudo&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; chmod&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; a+r&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt; /etc/apt/keyrings/docker.asc&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;echo&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#F47067\&quot;&gt; \\&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;  \&quot;deb [arch=$(&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#F69D50\&quot;&gt;dpkg&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; --print-architecture&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.co
