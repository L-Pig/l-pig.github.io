  const defaultTheme = "system";

  function getTheme(defaultTheme) {
    var darkMode = defaultTheme === "dark" ? true : false;
    if (localStorage.getItem("theme") === "system") {
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        darkMode = true;
      }
    } else if (localStorage.getItem("theme") === "dark") {
      darkMode = true;
    } else if (localStorage.getItem("theme") === "light") {
      darkMode = false;
    }
    return darkMode;
  }

  function setTheme(darkMode) {
    // Update DOM
    darkMode
      ? document.documentElement.classList.add("dark")
      : document.documentElement.classList.remove("dark");
    // Update localStorage
    localStorage.setItem("theme", darkMode ? "dark" : "light");
  }

  // This prevents flickering back to default theme before the page is fully loaded
  setTheme(getTheme(defaultTheme));

  document.addEventListener("astro:page-load", () => {
    setTheme(getTheme(defaultTheme));
    // Theme switcher
    var themeSwitch = document.querySelectorAll("[data-theme-switcher]");
    themeSwitch.forEach((el) => {
      el.addEventListener("change", (e) => {
        setTheme(e.target.checked);
      });
    });
  });

se],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;# 记录一下K8s常用的一些命令\n\n&gt; 管理和维护k8s集群的核心工具是其命令行客户端 `kubectl`。 掌握 `kubectl` 的常用命令对于开发者和运维人员至关重要。\n\n`kubectl` 的命令语法通常遵循以下格式：\n`kubectl [command] [TYPE] [NAME] [flags]`\n\n其中：\n  - **command**: 指定要执行的操作，例如 `create`、`get`、`delete`。\n  - **TYPE**: 指定资源类型，例如 `pod`、`deployment`、`service`。\n  - **NAME**: 指定具体资源的名称。\n  - **flags**: 指定可选参数，例如 `-n` 指定命名空间。\n\n以下是按功能分类的常用 `kubectl` 命令及其解释。\n\n## 一、集群信息与配置\n\n在对集群进行操作之前，首先需要了解集群的基本信息。\n\n| 命令 | 解释 |\n| --- | --- |\n| `kubectl version` | 显示客户端和服务端的版本信息。 |\n| `kubectl cluster-info` | 显示集群的详细信息，包括控制平面和服务的URL。 |\n| `kubectl config view` | 查看当前的 `kubeconfig` 配置。 |\n| `kubectl get namespaces` | 列出所有的命名空间 (namespace)。 |\n| `kubectl api-resources` | 列出所有支持的资源类型。 |\n\n## 二、资源管理：查看与检索 (Get &amp; Describe)\n\n查看资源是日常使用最频繁的操作之一。\n\n| 命令 | 解释 |\n| --- | --- |\n| `kubectl get &lt;资源类型&gt;` | 列出指定类型的所有资源。例如 `kubectl get pods`。 |\n| `kubectl get &lt;资源类型&gt; &lt;资源名称&gt;` | 获取特定资源的详细信息。例如 `kubectl get pod my-pod`。 |\n| `kubectl get all` | 列出当前命名空间中所有常见的资源。 |\n| `kubectl get pods -o wide` | 以更详细的格式列出Pod，包括所在的节点IP。 |\n| `kubectl get pods --show-labels` | 显示Pod的标签。 |\n| `kubectl describe &lt;资源类型&gt; &lt;资源名称&gt;` | 提供指定资源的非常详细的信息，通常用于排错。 |\n\n许多资源类型都有简写形式，以提高效率，例如 `pods` 可以简写为 `po`，`services` 可以简写为 `svc`，`deployments` 可以简写为 `deploy`。\n\n## 三、资源管理：创建、更新与删除 (Create, Apply, Delete)\n\n对于应用的部署和生命周期管理，以下命令至关重要。\n\n| 命令 | 解释 |\n| --- | --- |\n| `kubectl create -f &lt;文件名.yaml&gt;` | 通过YAML或JSON文件创建一个或多个资源。 |\n| `kubectl apply -f &lt;文件名.yaml&gt;` | 声明式地创建或更新资源，这是推荐的做法。 |\n| `kubectl delete -f &lt;文件名.yaml&gt;` | 删除YAML文件中定义的资源。 |\n| `kubectl delete &lt;资源类型&gt; &lt;资源名称&gt;` | 删除指定的资源。 |\n| `kubectl run &lt;名称&gt; --image=&lt;镜像&gt;` | 快速创建一个Deployment来运行一个或多个容器镜像。 |\n| `kubectl expose deployment &lt;名称&gt; --port=&lt;端口&gt;` | 为Deployment创建一个Service，以便外部可以访问。 |\n| `kubectl edit &lt;资源类型&gt; &lt;资源名称&gt;` | 使用默认编辑器直接编辑线上资源的配置。 |\n\n## 四、应用部署与伸缩 (Deployment &amp; Scaling)\n\nDeployment是管理应用部署的核心资源。\n\n| 命令 | 解释 |\n| --- | --- |\n| `kubectl get deployments` | 列出所有的Deployment。 |\n| `kubectl scale deployment &lt;名称&gt; --replicas=&lt;数量&gt;` | 动态地扩展或缩减Deployment的副本数量。 |\n| `kubectl rollout status deployment/&lt;名称&gt;` | 查看Deployment的部署状态。 |\n| `kubectl rollout history deployment/&lt;名称&gt;` | 查看Deployment的部署历史记录。 |\n| `kubectl rollout undo deployment/&lt;名称&gt;` | 回滚到上一个版本的Deployment。 |\n| `kubectl autoscale deployment &lt;名称&gt; --min=&lt;最小副本数&gt; --max=&lt;最大副本数&gt; --cpu-percent=&lt;CPU阈值&gt;` | 自动为Deployment设置水平Pod自动伸缩 (HPA)。 |\n\n## 五、故障排查与调试 (Troubleshooting &amp; Debugging)\n\n当应用出现问题时，以下命令可以帮助快速定位问题。\n\n| 命令 | 解释 |\n| --- | --- |\n| `kubectl logs &lt;Pod名称&gt;` | 查看指定Pod的日志。 |\n| `kubectl logs -f &lt;Pod名称&gt;` | 实时跟踪并输出Pod的日志。 |\n| `kubectl logs &lt;Pod名称&gt; -c &lt;容器名称&gt;` | 如果一个Pod中有多个容器，可以通过此命令查看特定容器的日志。 |\n| `kubectl exec -it &lt;Pod名称&gt; -- /bin/bash` | 进入正在运行的容器内部进行交互式操作。 |\n| `kubectl top pods` | 查看各个Pod的CPU和内存使用情况。 |\n| `kubectl top nodes` | 查看各个节点的资源使用情况。 |\n\n## 六、节点管理 (Node Management)\n\n对于集群的底层节点，也可以进行管理操作。\n\n| 命令 | 解释 |\n| --- | --- |\n| `kubectl get nodes` | 列出集群中所有的节点。 |\n| `kubectl describe node &lt;节点名称&gt;` | 查看节点的详细信息，包括其上的Pod列表。 |\n| `kubectl cordon &lt;节点名称&gt;` | 将节点标记为不可调度，新的Pod不会被调度到该节点上。 |\n| `kubectl uncordon &lt;节点名称&gt;` | 取消节点的不可调度标记。 |\n| `kubectl drain &lt;节点名称&gt;` | 安全地驱逐节点上的所有Pod，通常用于节点维护。 |&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/k8s-command.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/k8s.png&quot;]]],&quot;digest&quot;:[0,&quot;733319e1912e88d7&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h1 id=\&quot;记录一下k8s常用的一些命令\&quot;&gt;记录一下K8s常用的一些命令&lt;/h1&gt;\n&lt;blockquote&gt;\n&lt;p&gt;管理和维护k8s集群的核心工具是其命令行客户端 &lt;code&gt;kubectl&lt;/code&gt;。 掌握 &lt;code&gt;kubectl&lt;/code&gt; 的常用命令对于开发者和运维人员至关重要。&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;&lt;code&gt;kubectl&lt;/code&gt; 的命令语法通常遵循以下格式：\n&lt;code&gt;kubectl [command] [TYPE] [NAME] [flags]&lt;/code&gt;&lt;/p&gt;\n&lt;p&gt;其中：&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;command&lt;/strong&gt;: 指定要执行的操作，例如 &lt;code&gt;create&lt;/code&gt;、&lt;code&gt;get&lt;/code&gt;、&lt;code&gt;delete&lt;/code&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;TYPE&lt;/strong&gt;: 指定资源类型，例如 &lt;code&gt;pod&lt;/code&gt;、&lt;code&gt;deployment&lt;/code&gt;、&lt;code&gt;service&lt;/code&gt;。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;NAME&lt;/strong&gt;: 指定具体资源的名称。&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;flags&lt;/strong&gt;: 指定可选参数，例如 &lt;code&gt;-n&lt;/code&gt; 指定命名空间。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;以下是按功能分类的常用 &lt;code&gt;kubectl&lt;/code&gt; 命令及其解释。&lt;/p&gt;\n&lt;h2 id=\&quot;一集群信息与配置\&quot;&gt;一、集群信息与配置&lt;/h2&gt;\n&lt;p&gt;在对集群进行操作之前，首先需要了解集群的基本信息。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;命令&lt;/th&gt;&lt;th&gt;解释&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl version&lt;/code&gt;&lt;/td&gt;&lt;td&gt;显示客户端和服务端的版本信息。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl cluster-info&lt;/code&gt;&lt;/td&gt;&lt;td&gt;显示集群的详细信息，包括控制平面和服务的URL。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl config view&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看当前的 &lt;code&gt;kubeconfig&lt;/code&gt; 配置。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get namespaces&lt;/code&gt;&lt;/td&gt;&lt;td&gt;列出所有的命名空间 (namespace)。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl api-resources&lt;/code&gt;&lt;/td&gt;&lt;td&gt;列出所有支持的资源类型。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;h2 id=\&quot;二资源管理查看与检索-get--describe\&quot;&gt;二、资源管理：查看与检索 (Get &amp;#x26; Describe)&lt;/h2&gt;\n&lt;p&gt;查看资源是日常使用最频繁的操作之一。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;命令&lt;/th&gt;&lt;th&gt;解释&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get &amp;#x3C;资源类型&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;列出指定类型的所有资源。例如 &lt;code&gt;kubectl get pods&lt;/code&gt;。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get &amp;#x3C;资源类型&gt; &amp;#x3C;资源名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;获取特定资源的详细信息。例如 &lt;code&gt;kubectl get pod my-pod&lt;/code&gt;。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get all&lt;/code&gt;&lt;/td&gt;&lt;td&gt;列出当前命名空间中所有常见的资源。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get pods -o wide&lt;/code&gt;&lt;/td&gt;&lt;td&gt;以更详细的格式列出Pod，包括所在的节点IP。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get pods --show-labels&lt;/code&gt;&lt;/td&gt;&lt;td&gt;显示Pod的标签。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl describe &amp;#x3C;资源类型&gt; &amp;#x3C;资源名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;提供指定资源的非常详细的信息，通常用于排错。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;p&gt;许多资源类型都有简写形式，以提高效率，例如 &lt;code&gt;pods&lt;/code&gt; 可以简写为 &lt;code&gt;po&lt;/code&gt;，&lt;code&gt;services&lt;/code&gt; 可以简写为 &lt;code&gt;svc&lt;/code&gt;，&lt;code&gt;deployments&lt;/code&gt; 可以简写为 &lt;code&gt;deploy&lt;/code&gt;。&lt;/p&gt;\n&lt;h2 id=\&quot;三资源管理创建更新与删除-create-apply-delete\&quot;&gt;三、资源管理：创建、更新与删除 (Create, Apply, Delete)&lt;/h2&gt;\n&lt;p&gt;对于应用的部署和生命周期管理，以下命令至关重要。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;命令&lt;/th&gt;&lt;th&gt;解释&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl create -f &amp;#x3C;文件名.yaml&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;通过YAML或JSON文件创建一个或多个资源。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl apply -f &amp;#x3C;文件名.yaml&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;声明式地创建或更新资源，这是推荐的做法。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl delete -f &amp;#x3C;文件名.yaml&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;删除YAML文件中定义的资源。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl delete &amp;#x3C;资源类型&gt; &amp;#x3C;资源名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;删除指定的资源。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl run &amp;#x3C;名称&gt; --image=&amp;#x3C;镜像&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;快速创建一个Deployment来运行一个或多个容器镜像。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl expose deployment &amp;#x3C;名称&gt; --port=&amp;#x3C;端口&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;为Deployment创建一个Service，以便外部可以访问。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl edit &amp;#x3C;资源类型&gt; &amp;#x3C;资源名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;使用默认编辑器直接编辑线上资源的配置。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;h2 id=\&quot;四应用部署与伸缩-deployment--scaling\&quot;&gt;四、应用部署与伸缩 (Deployment &amp;#x26; Scaling)&lt;/h2&gt;\n&lt;p&gt;Deployment是管理应用部署的核心资源。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;命令&lt;/th&gt;&lt;th&gt;解释&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get deployments&lt;/code&gt;&lt;/td&gt;&lt;td&gt;列出所有的Deployment。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl scale deployment &amp;#x3C;名称&gt; --replicas=&amp;#x3C;数量&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;动态地扩展或缩减Deployment的副本数量。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl rollout status deployment/&amp;#x3C;名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看Deployment的部署状态。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl rollout history deployment/&amp;#x3C;名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看Deployment的部署历史记录。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl rollout undo deployment/&amp;#x3C;名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;回滚到上一个版本的Deployment。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl autoscale deployment &amp;#x3C;名称&gt; --min=&amp;#x3C;最小副本数&gt; --max=&amp;#x3C;最大副本数&gt; --cpu-percent=&amp;#x3C;CPU阈值&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;自动为Deployment设置水平Pod自动伸缩 (HPA)。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;h2 id=\&quot;五故障排查与调试-troubleshooting--debugging\&quot;&gt;五、故障排查与调试 (Troubleshooting &amp;#x26; Debugging)&lt;/h2&gt;\n&lt;p&gt;当应用出现问题时，以下命令可以帮助快速定位问题。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;命令&lt;/th&gt;&lt;th&gt;解释&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl logs &amp;#x3C;Pod名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看指定Pod的日志。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl logs -f &amp;#x3C;Pod名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;实时跟踪并输出Pod的日志。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl logs &amp;#x3C;Pod名称&gt; -c &amp;#x3C;容器名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;如果一个Pod中有多个容器，可以通过此命令查看特定容器的日志。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl exec -it &amp;#x3C;Pod名称&gt; -- /bin/bash&lt;/code&gt;&lt;/td&gt;&lt;td&gt;进入正在运行的容器内部进行交互式操作。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl top pods&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看各个Pod的CPU和内存使用情况。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl top nodes&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看各个节点的资源使用情况。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;\n&lt;h2 id=\&quot;六节点管理-node-management\&quot;&gt;六、节点管理 (Node Management)&lt;/h2&gt;\n&lt;p&gt;对于集群的底层节点，也可以进行管理操作。&lt;/p&gt;\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;命令&lt;/th&gt;&lt;th&gt;解释&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl get nodes&lt;/code&gt;&lt;/td&gt;&lt;td&gt;列出集群中所有的节点。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl describe node &amp;#x3C;节点名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;查看节点的详细信息，包括其上的Pod列表。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl cordon &amp;#x3C;节点名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;将节点标记为不可调度，新的Pod不会被调度到该节点上。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl uncordon &amp;#x3C;节点名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;取消节点的不可调度标记。&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;kubectl drain &amp;#x3C;节点名称&gt;&lt;/code&gt;&lt;/td&gt;&lt;td&gt;安全地驱逐节点上的所有Pod，通常用于节点维护。&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&quot;],&quot;metadata&quot;:[0,{&quot;headings&quot;:[1,[[0,{&quot;depth&quot;:[0,1],&quot;slug&quot;:[0,&quot;记录一下k8s常用的一些命令&quot;],&quot;text&quot;:[0,&quot;记录一下K8s常用的一些命令&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;一集群信息与配置&quot;],&quot;text&quot;:[0,&quot;一、集群信息与配置&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;二资源管理查看与检索-get--describe&quot;],&quot;text&quot;:[0,&quot;二、资源管理：查看与检索 (Get &amp; Describe)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;三资源管理创建更新与删除-create-apply-delete&quot;],&quot;text&quot;:[0,&quot;三、资源管理：创建、更新与删除 (Create, Apply, Delete)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;四应用部署与伸缩-deployment--scaling&quot;],&quot;text&quot;:[0,&quot;四、应用部署与伸缩 (Deployment &amp; Scaling)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;五故障排查与调试-troubleshooting--debugging&quot;],&quot;text&quot;:[0,&quot;五、故障排查与调试 (Troubleshooting &amp; Debugging)&quot;]}],[0,{&quot;depth&quot;:[0,2],&quot;slug&quot;:[0,&quot;六节点管理-node-management&quot;],&quot;text&quot;:[0,&quot;六、节点管理 (Node Management)&quot;]}]]],&quot;localImagePaths&quot;:[1,[]],&quot;remoteImagePaths&quot;:[1,[]],&quot;frontmatter&quot;:[0,{&quot;title&quot;:[0,&quot;Kubernetes 常用命令&quot;],&quot;description&quot;:[0,&quot;Kubernetes 常用命令&quot;],&quot;createdAt&quot;:[3,&quot;2026-02-18T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-02-18T00:00:00.000Z&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;image&quot;:[0,&quot;@assets/uploads/k8s.png&quot;],&quot;categories&quot;:[1,[[0,&quot;Linux&quot;],[0,&quot;Kubernetes&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Kubernetes&quot;],[0,&quot;k8s&quot;]]],&quot;draft&quot;:[0,false],&quot;hideToc&quot;:[0,true]}],&quot;imagePaths&quot;:[1,[]]}]}],&quot;collection&quot;:[0,&quot;blog&quot;]}],[0,{&quot;id&quot;:[0,&quot;index-lose-efficacy&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;MySQL索引失效的几种情况&quot;],&quot;description&quot;:[0,&quot;MySQL索引失效的几种情况&quot;],&quot;draft&quot;:[0,false],&quot;createdAt&quot;:[3,&quot;2026-01-12T00:00:00.000Z&quot;],&quot;updatedAt&quot;:[3,&quot;2026-01-12T00:00:00.000Z&quot;],&quot;image&quot;:[0,{&quot;src&quot;:[0,&quot;/_astro/mysql.BNmiDldO.png&quot;],&quot;width&quot;:[0,2800],&quot;height&quot;:[0,2800],&quot;format&quot;:[0,&quot;png&quot;]}],&quot;imageAlt&quot;:[0,&quot;&quot;],&quot;author&quot;:[0,&quot;L-Pig&quot;],&quot;categories&quot;:[1,[[0,&quot;Mysql&quot;]]],&quot;tags&quot;:[1,[[0,&quot;mysql&quot;]]],&quot;status&quot;:[0,&quot;published&quot;],&quot;featured&quot;:[0,false],&quot;recommended&quot;:[0,false],&quot;views&quot;:[0,0],&quot;hideToc&quot;:[0,true]}],&quot;body&quot;:[0,&quot;## 一、如何判定索引实效\n\n- 索引实效本质上是 MYSQL 查询优化器判断使用索引的查询成本高于全表扫描，或者无法通过索引快速定位到要查询的数据，故而放弃使用索引，执行了全表扫描。\n- 使用`explain` 分析查询语句，可以用于判断查询语句是否使用到索引，重点关注 `type` 和 `key` 两个字段，`type` 字段表示索引类型，`key` 字段表示索引列。\n\n\n## 二、Explain 分析结果字段说明\n\n使用 `explain` 分析查询语句会返回一些字段，下面是对字段的解释\n\n可以使用 `select version()` 查询数据库版本\n![mysql-version](/assets/uploads/mysql-version.png)\n\n\n假定执行的sql语句为：\n```sql\nexplain SELECT * FROM authentication.tokens where id = 1;\n```\n\n你会得到如下的结果\n\n![mysql-explain](/assets/uploads/mysql-explain.png)\n\n- `select-type` : 查询类型，有以下几种类型\n  - `SIMPLE` : 简单查询，未使用 `union` 或子查询\n  - `PRIMARY` : 最外层的查询\n  - `SUBQUERY` : 子查询\n  - `DEPENDENT SUBQUERY` : 依赖子查询，依赖于外层查询\n  - `DERIVED` : 用来表示包含在 `from` 子句的子查询中的 `select` ，mysql 会递归执行并将结果放到临时表中，mysql 内部称其为派生表(derived table)，因为该表是从子查询中派生出来的\n  - `DEPENDENT DERIVED` : 派生表，依赖了其他表\n  - `MATERIALIZED` : 物化视图\n  - `UNION` : 在 `union` 中的第二个和随后的`select`，如果 `union` 被 `from` 字句中的资查询包含，则它的第一个 `select` 为 `DERIVED`\n  - `DEPENDENT UNION` : `union` 中的第二个或后面的查询，依赖于外层查询\n  - `UNION RESULT` : `union` 的结果集\n  - `UNCACHEABLE SUBQUERY` : 无法缓存的子查询，子查询的结果不能被缓存\n  - `UNCACHEABLE UNION` : 无法缓存的联合查询，联合查询的结果不能被缓存\n- `tabel` : 表名，表示当前这一行正在访问哪张表，如果SQL定义了别名，则展示表的别名 \n- `partitions` : 当前查询匹配记录的分区。对于未分区的表，返回null\n- `type` :  连接类型，以下性能从好到坏\n  - `system` : 该表只有一行，相当于系统表\n  - `const` : 该表中所有索引列都包含了常量，查询时最多匹配一行\n  - `eq_ref` : 在连接查询中，对于前一个表的每一行，在后一个表中只有一行数据与之匹配。通常出现在使用主键或唯一非空索引进行表连接的查询中\n  - `ref` : 区别于 `eq_ref`，`ref` 类型的连接查询会返回多行匹配的数据。这通常发生在非唯一性索引的等值查询中\n  - `range` : 表示在一个给定的范围内进行索引扫描，而不是扫描整个索引\n  - `index` : 全索引扫描，与 `ALL` 的区别在于 `index` 类型只遍历索引树。虽然也扫描了整个索引，但通常比全表扫描快，因为索引文件通常比数据文件小\n  - `ALL` : 全表扫描，MySQL 需要从头到尾扫描整个表来找到匹配的行\n- `possible_keys` : 展示当前查询可以使用哪些索引，这一列的数据是在优化过程的早期创建的，因此有些索引可能对于后续优化过程是没用的\n- `key` : 表示MySQL实际选择的索引\n- `key_len` : 索引使用的字节数。由于存储格式，当字段允许为NULL时，key_len比不允许为空时大1字节\n- `ref` : 数据库是用什么（常量、列、函数）来和 `key` 列中选用的索引进行比较，从而选出记录的，常见的有以下几种情况\n  - `const` ： 示查询条件中，索引列是与一个**常量值**进行比较的\n  - `数据库名.表名.列名` : 表示查询条件中，索引列是与**另一个表的列**进行比较的。这通常出现在 **JOIN** 操作中\n  - `func` : 表示索引列是与一个**函数的结果**或**类型转换后的结果**进行比较\n  - `NULL` : 表示没有使用索引进行具体的等值查找（Range 扫描或全表扫描\n- `rows` : MySQL估算会扫描的行数，数值越小越好\n- `filtered` : 这是一个**百分比**（0.00% ~ 100.00%）。它表示存储引擎返回的数据，经过 Server 层过滤后，**剩余记录占读取记录的比例**\n  - 计算公式：有效数据 / 扫描到的数据 * 100%\n  - 用于评估索引的精准度，百分比越大，索引的效率越高\n- `Extra` : 包含了 MySQL 执行查询时的详细动作，结果可以分为三大类，下面是详细说明\n  - ✅ 好：\n    - `Using index` : 查询需要的**所有列**都在索引树上找到了，**不需要回表**（即不需要去查数据行）\n  - ⭕ 中：\n    - `Using where` : 存储引擎将数据读出来后，**Server 层**根据 `WHERE` 条件又进行了一次过滤\n    - `Using index condition` : MySQL 的优化特性。它把部分 `WHERE` 条件“下推”给存储引擎，在引擎层就过滤掉不符合索引条件的数据，减少回表次数\n  - ❌ 坏：\n    - `Using filesort` : 文件排序，查询包含 `ORDER BY`，但无法利用索引完成排序，MySQL 必须在内存（或磁盘）中进行额外的排序操作\n    - `Using temporary` : 临时表，MySQL 需要创建一张内部临时表来处理查询。常见于 `GROUP BY` 或 `DISTINCT` 操作，且列没有索引时\n  - 其他情况：\n    - `Select tables optimized away` : 使用聚合函数（如 `MAX()`, `MIN()`）直接访问索引，甚至不需要查表，速度极快\n    - `NULL` : 如果使用了主键或唯一索引查找，Extra 可能是空的\n\n## 三、索引实效的情况\n\n&gt; 假设有一张 `staff` 表，如下定义：\n```sql\nCREATE TABLE staff (\n    id INT AUTO_INCREMENT PRIMARY KEY,\n    name VARCHAR(24) NOT NULL,\n    age INT NOT NULL,\n    pos VARCHAR(20) NOT NULL,\n    phone VARCHAR(20),\n    INDEX idx_name_age_pos (name, age, pos),\n    INDEX idx_phone (phone)\n);\n```\n&gt;插入一条数据\n```sql\nINSERT into staff(`name`,age,pos,phone) value(\&quot;张三\&quot;,30,\&quot;总经理\&quot;,\&quot;13111112222\&quot;);\n```\n&gt; 查看数据\n```sql\nselect * from staff;\n```\n![staff-select-result](/assets/uploads/staff-select-result.png)\n\n### 1. 违反 **最左匹配原则** 。\n&gt; 如果索引了多列，要遵守最左前缀原则。指的是查询要从索引的最左前列开始并且不跳过索引中的列\n\n- 失效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE age = 25;\n  ```\n\n- 部分失效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE name = &#39;张三&#39; AND pos = &#39;总经理&#39;;\n  ```\n\n- 有效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE name = &#39;张三&#39; and age = 25;\n  ```\n\n### 2. 在 **索引列上操作**。\n&gt; 如索引列上进行计算、函数、自动或手动类型转换\n\n- 失效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE LEFT(name, 1) = &#39;张&#39;;\n  EXPLAIN SELECT * FROM staff WHERE phone = 13800001234\n  ```\n\n- 有效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE nam like &#39;张%&#39;;\n  EXPLAIN SELECT * FROM staff WHERE phone = &#39;13800001234&#39;;\n  ```\n\n### 3. 使用 **不等于** （`!=` 或 `&lt;&gt;`等）。\n&gt; 在某些版本或特定数据量下，使用了不等号会导致索引失效。等于某个值可以快速定位，但不等于某个值，通常意味着要取出一大部分数据，优化器可能认为全表扫描更快\n\n- 可能失效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE name != &#39;张三&#39;;\n  ```\n\n### 4. 使用 `or` 。\n&gt; 如果 `OR` 连接的条件中，有一个字段没有索引，那么涉及的所有索引都不会被用到\n\n- 失效sql：\n  ```sql\n   EXPLAIN SELECT * FROM staff WHERE name = &#39;张三&#39; OR age = 25;\n  ```\n- 优化方案：\n  - 给OR条件中的字段加索引\n  - 使用 `union` 代替 `or` 连接条件\n\n### 5. like查询 **是以 `&#39;%&#39;`开头** 。&#39;\n&gt; 索引失效，原因是like查询是以`&#39;%&#39;`开头，B+树是按照顺序排列的，后缀匹配无法利用有序性。\n- 失效sql：\n  ```sql\n    EXPLAIN SELECT * FROM staff WHERE name LIKE &#39;%张&#39;;\n  ```\n  \n- 有效sql：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE name LIKE &#39;张%&#39;;\n  ```\n\n### 6. **使用 `&lt;`,`&gt;`、`between、and`**。\n&gt; 在联合索引中，如果遇到范围查询（`&gt;`, `&lt;`, `BETWEEN`, `LIKE &#39;a%&#39;`），则**范围条件右边的列**无法用到索引，存储引擎不能使用索引中范围条件右边的列，无法重建索引\n\n- 部分失效 SQL：\n  ```sql\n  EXPLAIN SELECT * FROM staff WHERE name = &#39;张三&#39; AND age &gt; 25 AND pos = &#39;董事长&#39;;\n  ```\n### 7. **IS NULL 和 IS NOT NULL**\n&gt; 不同版本的 MySQL 中表现不同，但通常建议尽量避免允许 NULL 值。\n- `IS NOT NULL` 通常会触发全表扫描\n- 如果表中绝大多数数据都是 `NULL`，那么查 `IS NOT NULL` 可能会走索引。反之亦然。这取决于**数据分布**。\n\n### 8. 使用 **select** 。\n&gt; 索引失效，原因是 `select` 语句可能会导致 MySQL 优化器放弃使用索引，执行全表扫描。\n\n- 尽可能只查询需要的字段，避免 `select *`\n\n## 四、 小口诀\n\n**全值匹配我最爱，最左前缀要遵守；**  \n&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;**带头大哥不能死，中间兄弟不能断；**  \n&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;**索引列上少计算，范围之后全失效；**  \n&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;**LIKE百分写最右，覆盖索引不写星；**  \n&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;**不等空值还有OR，索引失效要唯心（看优化器心情）。**&quot;],&quot;filePath&quot;:[0,&quot;src/content/blog/index-lose-efficacy.md&quot;],&quot;assetImports&quot;:[1,[[0,&quot;@assets/uploads/mysql.png&quot;]]],&quot;digest&quot;:[0,&quot;5d3c8562e4b09fe1&quot;],&quot;rendered&quot;:[0,{&quot;html&quot;:[0,&quot;&lt;h2 id=\&quot;一如何判定索引实效\&quot;&gt;一、如何判定索引实效&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;索引实效本质上是 MYSQL 查询优化器判断使用索引的查询成本高于全表扫描，或者无法通过索引快速定位到要查询的数据，故而放弃使用索引，执行了全表扫描。&lt;/li&gt;\n&lt;li&gt;使用&lt;code&gt;explain&lt;/code&gt; 分析查询语句，可以用于判断查询语句是否使用到索引，重点关注 &lt;code&gt;type&lt;/code&gt; 和 &lt;code&gt;key&lt;/code&gt; 两个字段，&lt;code&gt;type&lt;/code&gt; 字段表示索引类型，&lt;code&gt;key&lt;/code&gt; 字段表示索引列。&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;二explain-分析结果字段说明\&quot;&gt;二、Explain 分析结果字段说明&lt;/h2&gt;\n&lt;p&gt;使用 &lt;code&gt;explain&lt;/code&gt; 分析查询语句会返回一些字段，下面是对字段的解释&lt;/p&gt;\n&lt;p&gt;可以使用 &lt;code&gt;select version()&lt;/code&gt; 查询数据库版本\n&lt;img src=\&quot;/assets/uploads/mysql-version.png\&quot; alt=\&quot;mysql-version\&quot;&gt;&lt;/p&gt;\n&lt;p&gt;假定执行的sql语句为：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;explain &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;SELECT&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; FROM&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; authentication&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;.&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;tokens&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; where&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; id &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;=&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt; 1&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;;&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;你会得到如下的结果&lt;/p&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/mysql-explain.png\&quot; alt=\&quot;mysql-explain\&quot;&gt;&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;select-type&lt;/code&gt; : 查询类型，有以下几种类型\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;SIMPLE&lt;/code&gt; : 简单查询，未使用 &lt;code&gt;union&lt;/code&gt; 或子查询&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;PRIMARY&lt;/code&gt; : 最外层的查询&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;SUBQUERY&lt;/code&gt; : 子查询&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEPENDENT SUBQUERY&lt;/code&gt; : 依赖子查询，依赖于外层查询&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DERIVED&lt;/code&gt; : 用来表示包含在 &lt;code&gt;from&lt;/code&gt; 子句的子查询中的 &lt;code&gt;select&lt;/code&gt; ，mysql 会递归执行并将结果放到临时表中，mysql 内部称其为派生表(derived table)，因为该表是从子查询中派生出来的&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEPENDENT DERIVED&lt;/code&gt; : 派生表，依赖了其他表&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;MATERIALIZED&lt;/code&gt; : 物化视图&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNION&lt;/code&gt; : 在 &lt;code&gt;union&lt;/code&gt; 中的第二个和随后的&lt;code&gt;select&lt;/code&gt;，如果 &lt;code&gt;union&lt;/code&gt; 被 &lt;code&gt;from&lt;/code&gt; 字句中的资查询包含，则它的第一个 &lt;code&gt;select&lt;/code&gt; 为 &lt;code&gt;DERIVED&lt;/code&gt;&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;DEPENDENT UNION&lt;/code&gt; : &lt;code&gt;union&lt;/code&gt; 中的第二个或后面的查询，依赖于外层查询&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNION RESULT&lt;/code&gt; : &lt;code&gt;union&lt;/code&gt; 的结果集&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNCACHEABLE SUBQUERY&lt;/code&gt; : 无法缓存的子查询，子查询的结果不能被缓存&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;UNCACHEABLE UNION&lt;/code&gt; : 无法缓存的联合查询，联合查询的结果不能被缓存&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;tabel&lt;/code&gt; : 表名，表示当前这一行正在访问哪张表，如果SQL定义了别名，则展示表的别名&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;partitions&lt;/code&gt; : 当前查询匹配记录的分区。对于未分区的表，返回null&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;type&lt;/code&gt; :  连接类型，以下性能从好到坏\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;system&lt;/code&gt; : 该表只有一行，相当于系统表&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;const&lt;/code&gt; : 该表中所有索引列都包含了常量，查询时最多匹配一行&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;eq_ref&lt;/code&gt; : 在连接查询中，对于前一个表的每一行，在后一个表中只有一行数据与之匹配。通常出现在使用主键或唯一非空索引进行表连接的查询中&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ref&lt;/code&gt; : 区别于 &lt;code&gt;eq_ref&lt;/code&gt;，&lt;code&gt;ref&lt;/code&gt; 类型的连接查询会返回多行匹配的数据。这通常发生在非唯一性索引的等值查询中&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;range&lt;/code&gt; : 表示在一个给定的范围内进行索引扫描，而不是扫描整个索引&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;index&lt;/code&gt; : 全索引扫描，与 &lt;code&gt;ALL&lt;/code&gt; 的区别在于 &lt;code&gt;index&lt;/code&gt; 类型只遍历索引树。虽然也扫描了整个索引，但通常比全表扫描快，因为索引文件通常比数据文件小&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ALL&lt;/code&gt; : 全表扫描，MySQL 需要从头到尾扫描整个表来找到匹配的行&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;possible_keys&lt;/code&gt; : 展示当前查询可以使用哪些索引，这一列的数据是在优化过程的早期创建的，因此有些索引可能对于后续优化过程是没用的&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;key&lt;/code&gt; : 表示MySQL实际选择的索引&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;key_len&lt;/code&gt; : 索引使用的字节数。由于存储格式，当字段允许为NULL时，key_len比不允许为空时大1字节&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;ref&lt;/code&gt; : 数据库是用什么（常量、列、函数）来和 &lt;code&gt;key&lt;/code&gt; 列中选用的索引进行比较，从而选出记录的，常见的有以下几种情况\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;const&lt;/code&gt; ： 示查询条件中，索引列是与一个&lt;strong&gt;常量值&lt;/strong&gt;进行比较的&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;数据库名.表名.列名&lt;/code&gt; : 表示查询条件中，索引列是与&lt;strong&gt;另一个表的列&lt;/strong&gt;进行比较的。这通常出现在 &lt;strong&gt;JOIN&lt;/strong&gt; 操作中&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;func&lt;/code&gt; : 表示索引列是与一个&lt;strong&gt;函数的结果&lt;/strong&gt;或&lt;strong&gt;类型转换后的结果&lt;/strong&gt;进行比较&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt; : 表示没有使用索引进行具体的等值查找（Range 扫描或全表扫描&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;rows&lt;/code&gt; : MySQL估算会扫描的行数，数值越小越好&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;filtered&lt;/code&gt; : 这是一个&lt;strong&gt;百分比&lt;/strong&gt;（0.00% ~ 100.00%）。它表示存储引擎返回的数据，经过 Server 层过滤后，&lt;strong&gt;剩余记录占读取记录的比例&lt;/strong&gt;\n&lt;ul&gt;\n&lt;li&gt;计算公式：有效数据 / 扫描到的数据 * 100%&lt;/li&gt;\n&lt;li&gt;用于评估索引的精准度，百分比越大，索引的效率越高&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Extra&lt;/code&gt; : 包含了 MySQL 执行查询时的详细动作，结果可以分为三大类，下面是详细说明\n&lt;ul&gt;\n&lt;li&gt;✅ 好：\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Using index&lt;/code&gt; : 查询需要的&lt;strong&gt;所有列&lt;/strong&gt;都在索引树上找到了，&lt;strong&gt;不需要回表&lt;/strong&gt;（即不需要去查数据行）&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;⭕ 中：\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Using where&lt;/code&gt; : 存储引擎将数据读出来后，&lt;strong&gt;Server 层&lt;/strong&gt;根据 &lt;code&gt;WHERE&lt;/code&gt; 条件又进行了一次过滤&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Using index condition&lt;/code&gt; : MySQL 的优化特性。它把部分 &lt;code&gt;WHERE&lt;/code&gt; 条件“下推”给存储引擎，在引擎层就过滤掉不符合索引条件的数据，减少回表次数&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;❌ 坏：\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Using filesort&lt;/code&gt; : 文件排序，查询包含 &lt;code&gt;ORDER BY&lt;/code&gt;，但无法利用索引完成排序，MySQL 必须在内存（或磁盘）中进行额外的排序操作&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;Using temporary&lt;/code&gt; : 临时表，MySQL 需要创建一张内部临时表来处理查询。常见于 &lt;code&gt;GROUP BY&lt;/code&gt; 或 &lt;code&gt;DISTINCT&lt;/code&gt; 操作，且列没有索引时&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;其他情况：\n&lt;ul&gt;\n&lt;li&gt;&lt;code&gt;Select tables optimized away&lt;/code&gt; : 使用聚合函数（如 &lt;code&gt;MAX()&lt;/code&gt;, &lt;code&gt;MIN()&lt;/code&gt;）直接访问索引，甚至不需要查表，速度极快&lt;/li&gt;\n&lt;li&gt;&lt;code&gt;NULL&lt;/code&gt; : 如果使用了主键或唯一索引查找，Extra 可能是空的&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\&quot;三索引实效的情况\&quot;&gt;三、索引实效的情况&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;假设有一张 &lt;code&gt;staff&lt;/code&gt; 表，如下定义：&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;CREATE&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; TABLE&lt;/span&gt;&lt;span style=\&quot;color:#6F42C1;--shiki-dark:#DCBDFB\&quot;&gt; staff&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; (&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    id &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;INT&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; AUTO_INCREMENT &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;PRIMARY KEY&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;    name&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; VARCHAR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;24&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;NOT NULL&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    age &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;INT&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; NOT NULL&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    pos &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;VARCHAR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;20&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;) &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;NOT NULL&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;    phone &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;VARCHAR&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;20&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;),&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;    INDEX&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; idx_name_age_pos (&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;name&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;, age, pos),&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;    INDEX&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; idx_phone (phone)&lt;/span&gt;&lt;/span&gt;\n&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;);&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;blockquote&gt;\n&lt;p&gt;插入一条数据&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;INSERT into&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; staff(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;`name`&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,age,pos,phone) &lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;value&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;(&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;张三\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#005CC5;--shiki-dark:#6CB6FF\&quot;&gt;30&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;总经理\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;,&lt;/span&gt;&lt;span style=\&quot;color:#032F62;--shiki-dark:#96D0FF\&quot;&gt;\&quot;13111112222\&quot;&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt;);&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;blockquote&gt;\n&lt;p&gt;查看数据&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&quot;&gt;&lt;code&gt;&lt;span class=\&quot;line\&quot;&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt;select&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; *&lt;/span&gt;&lt;span style=\&quot;color:#D73A49;--shiki-dark:#F47067\&quot;&gt; from&lt;/span&gt;&lt;span style=\&quot;color:#24292E;--shiki-dark:#ADBAC7\&quot;&gt; staff;&lt;/span&gt;&lt;/span&gt;&lt;/code&gt;&lt;/pre&gt;\n&lt;p&gt;&lt;img src=\&quot;/assets/uploads/staff-select-result.png\&quot; alt=\&quot;staff-select-result\&quot;&gt;&lt;/p&gt;\n&lt;h3 id=\&quot;1-违反-最左匹配原则\&quot;&gt;1. 违反 &lt;strong&gt;最左匹配原则&lt;/strong&gt; 。&lt;/h3&gt;\n&lt;blockquote&gt;\n&lt;p&gt;如果索引了多列，要遵守最左前缀原则。指的是查询要从索引的最左前列开始并且不跳过索引中的列&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;失效sql：&lt;/p&gt;\n&lt;pre class=\&quot;astro-code astro-code-themes github-light github-dark-dimmed\&quot; style=\&quot;background-color:#fff;--shiki-dark-bg:#22272e;color:#24292e;--shiki-dark:#adbac7; overflow-x: auto;\&quot; tabindex=\&quot;0\&quot; data-language=\&quot;sql\&qu
